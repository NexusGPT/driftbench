# The leak guard's secret scan (gitleaks 8.24, default rules) with one narrow exception.
#
# A judge cassette keys each recorded answer by a 12-character hex content hash, in a field named "key".
# The generic-api-key rule reads some of those hashes as secrets. The exception allows only a line that
# holds that field and such a hash and nothing else. A longer value, another field, or a token of any
# known format on the same line is still reported (checked with gitleaks 8.24.3 on 2026-10-12).
title = "driftbench gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "judge cassette request keys are 12-character content hashes"
regexTarget = "line"
regexes = ['''^[+\s]*"key": "[0-9a-f]{12}",?\s*$''']

# The all-peers call journal stores each request under a field named "key" whose value is the 64-character
# sha256 of model, system prompt and user text. The generic-api-key rule reads those hashes as secrets.
# The exception needs both conditions: a file under examples/all-peers-public/cells/calls-parts/, and a
# finding whose text is the field "key" or "attempt_key" followed by hex digits only (gitleaks 8.30 reports a
# prefix of the hash, 8.24 the whole value). Any other finding in the same files, a non-hex value, or another
# field name is still reported.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "all-peers call journal request keys are sha256 content hashes"
condition = "AND"
paths = ['''^examples/all-peers-public/cells/calls-parts/part-\d{4}\.jsonl$''']
regexTarget = "match"
regexes = ['''^(attempt_)?key"?\s*[:=]\s*"?[0-9a-f]{16,64}"?$''']
