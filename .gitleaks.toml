# The leak guard's secret scan (gitleaks 8.24, default rules) with one narrow exception.
#
# A judge cassette keys each recorded answer by a 12-character hex content hash, in a field named "key".
# The generic-api-key rule reads some of those hashes as secrets. The exception allows only a line that
# holds that field and such a hash and nothing else. A longer value, another field, or a token of any
# known format on the same line is still reported (checked with gitleaks 8.24.3 on 2026-10-12).
title = "driftbench gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "judge cassette request keys are 12-character content hashes"
regexTarget = "line"
regexes = ['''^[+\s]*"key": "[0-9a-f]{12}",?\s*$''']

# Recording content hashes. Three recording folders store each request under a content hash: the all-peers call
# journal ("key", "attempt_key"), the ledger-verify evidence ("key") and the RubricBench pair-ledger recordings
# ("key", "callKey", "probeCallKey", and freeze records that map the file .cache/ledger-rb/audit-token-loss.py to
# its sha256). The generic-api-key rule reads those hashes as secrets.
#
# Its match starts at the keyword, so "api/key" and "key" give the same match text; a match-level exception would
# also pass "api/key". The exceptions below therefore read the whole line and pass only a line that holds one such
# field with a bare lowercase hex value and nothing else. A hash inside a longer JSONL line is not covered here: it
# is listed by exact commit, file and line in the generated block of .gitleaksignore, which
# tools/guard/gitleaks-recording-fingerprints.mjs rebuilds and which refuses any line that carries another finding.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "all-peers call journal: a line holding only a key or attempt_key content hash"
condition = "AND"
paths = ['''^examples/all-peers-public/cells/calls-parts/part-\d{4}\.jsonl$''']
regexTarget = "line"
regexes = ['''^[+\s]*"(?:attempt_)?key"\s*:\s*"[0-9a-f]{16,64}",?\s*$''']

[[rules.allowlists]]
description = "ledger-verify evidence: a line holding only a key content hash"
condition = "AND"
paths = ['''^examples/ledger-verify/''']
regexTarget = "line"
regexes = ['''^[+\s]*"key"\s*:\s*"[0-9a-f]{12,64}",?\s*$''']

[[rules.allowlists]]
description = "RubricBench ledger-rb recordings: a line holding only one content hash field"
condition = "AND"
paths = ['''^examples/judge-benchmarks/experiments/ledger-rb/''']
regexTarget = "line"
regexes = ['''^[+\s]*"(?:key|callKey|probeCallKey)"\s*:\s*"[0-9a-f]{12,64}",?\s*$''', '''^[+\s]*"\.cache/ledger-rb/audit-token-loss\.py"\s*:\s*"[0-9a-f]{64}",?\s*$''']

# Estate cassettes. A pointer-reader cassette stores each recorded labeler answer under a 64-character request hash in
# a field named "key", and the other hashes of the request (cutDigest, setHash, part.*) beside it. The generic-api-key
# rule reads those hashes as secrets. The exception reads the whole line and passes only a line that has the exact
# shape of one cassette entry: the answer (labels or probabilities, a model name, a stop reason and the token
# counts), then "key" with exactly 64 lowercase hex characters, then the readable request fields, each value in a
# narrow character class (no digit or underscore in a path, lowercase model names of at most 24 characters). A line
# with another field, a longer or non-hex key, or a token of any known format in a value is not that shape and is
# still reported, as is the same line in any other file.
[[rules.allowlists]]
description = "estate cassettes: a line that is exactly one recorded answer under a 64-hex request key"
condition = "AND"
paths = ['''^examples/estates/[^/]+/(?:[a-z-]+-)?cassette\.jsonl$''']
regexTarget = "line"
regexes = ['''^[+\s]*\{"answer":\{"(?:labels":\[(?:\{"label":"[a-z-]{1,30}"(?:,"target":[0-9]{1,3})?,"units":"[0-9-]{1,9}"\},?)*\]|probabilities":\{(?:"u[0-9]{1,4}__[a-z-]{1,30}":[0-9](?:\.[0-9]{1,17})?,?)*\}),"returnedModel":"[a-z0-9.-]{1,24}","stopReason":"[a-z_]{1,20}","usage":\{"input":[0-9]{1,7},"output":[0-9]{1,7}\}\},"key":"[0-9a-f]{64}","readable":\{"cls":"system[12]","cutDigest":"[0-9a-f]{64}","labeler":"[a-z0-9-]{1,24}","model":"[a-z0-9.-]{1,24}",(?:"part\.[a-zA-Z_]{1,16}":"[0-9a-f]{12}",)+"path":"(?:\.?[a-z-]+/)*[A-Za-z-]{1,30}\.(?:md|json|sh|py)","promptVersion":"p[0-9]{1,2}","run":"[0-9]{1,2}","schemaVersion":"s[0-9]{1,2}","set":"[a-z-]{1,30}","setHash":"[0-9a-f]{16}","window":"(?:\.?[a-z-]+/)*[A-Za-z-]{1,30}\.(?:md|json|sh|py)#[0-9]{1,4}"\}\}\s*$''']
