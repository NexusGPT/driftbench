# Estate configuration for driftbench: paths under the estate the runtime never loads, beside the defaults.
# Each glob is matched like a .gitignore line: without a leading slash it matches at any depth,
# and a folder matched by it is skipped whole.
ignore:
  - archive
# Folders outside the estate a path may name: the project the agent works on and the shared workspace.
# They replace the defaults (docs/ and _meta/), so the defaults are listed again.
externals:
  - docs
  - _meta
  - companies
# Fixtures of the scripts, run by driftbench estate unit: arguments, stdin, files in the working folder,
# and the exit code and stdout each must give.
scripts:
  .claude/skills/shipment-tracker/scripts/track.sh:
    - { args: [], expect: { exitCode: 2 } }
    - { args: ["NWX", "999"], expect: { exitCode: 1 } }
