# The candidate store for the condition feed: invented situations an estate clause can name.
# Six of the fifteen values have no clause in the planted spans (decoys), and four conditions of the spans have no value here.
format: 1
agent: northwind
version: conditions-1
prior:
  kind: declared
variables:
  - id: shipment_delay
    title: How late a shipment is
    kind: data
    role: detail
    approved: true
    values:
      - { id: late_over_two_days, title: A shipment is late by more than two days }
      - { id: late_over_one_day, title: A shipment is late by more than one day }
      - { id: lost, title: A shipment is lost }
  - id: session_state
    title: The state of the session
    kind: data
    role: axis
    approved: true
    values:
      - { id: after_compaction, title: The session was just compacted }
      - { id: after_restart, title: The session was just restarted }
  - id: invoice_work
    title: The work done on an invoice
    kind: task
    role: detail
    approved: true
    values:
      - { id: before_invoice_edit, title: An invoice file is about to be edited }
      - { id: invoice_diff_over_50, title: The total difference of an invoice is above 50.00 EUR }
  - id: helper
    title: Work handed to a helper agent
    kind: task
    role: detail
    approved: true
    values:
      - { id: before_helper_dispatch, title: A helper agent is about to be dispatched }
      - { id: helper_died, title: A helper agent died }
  - id: approval
    title: An approval the agent waits for
    kind: stage
    role: detail
    approved: true
    values:
      - { id: approval_unanswered, title: A person whose approval is needed has not answered }
      - { id: approval_given, title: A person gave an explicit yes }
  - id: supplier
    title: The supplier of an order
    kind: data
    role: detail
    approved: true
    values:
      - { id: supplier_not_in_table, title: A supplier is not in the language table }
      - { id: supplier_in_table, title: A supplier is in the language table }
  - id: carrier
    title: What the carrier answers
    kind: data
    role: detail
    approved: true
    values:
      - { id: carrier_error, title: The carrier answers with an error }
      - { id: carrier_status, title: The carrier answers with a status }
