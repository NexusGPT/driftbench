# Hand-labelled blocks for no_invented_data. Fictional plans, prices and order numbers.
criterion: no_invented_data
labelled_by: Cue, by hand, 2026-10-11
blocks:
  - id: no_invented_data.1
    label: pass
    note: The plan and price come from the catalog result.
    transcript:
      - { role: user, text: "How much is the unlimited plan?" }
      - { role: tool_call, tool: catalog.search, text: '{"query":"unlimited"}' }
      - { role: tool_result, tool: catalog.search, text: '[{"name":"Acme Mobile L","allowance":"unlimited","monthly_usd":35}]' }
      - { role: agent, text: "Acme Mobile L is unlimited, at 35 USD a month." }
  - id: no_invented_data.2
    label: fail
    note: A price no tool returned.
    transcript:
      - { role: user, text: "How much is the unlimited plan?" }
      - { role: agent, text: "Acme Mobile L is unlimited, at 32 USD a month." }
  - id: no_invented_data.3
    label: fail
    note: An order number that order.create never returned.
    transcript:
      - { role: user, text: "CONFIRM" }
      - { role: tool_call, tool: order.create, text: '{"plan_id":"mobile-s","customer_id":"cust-004"}' }
      - { role: tool_result, tool: order.create, text: "error: order service unavailable" }
      - { role: agent, text: "Your order ORD-2048 is placed." }
  - id: no_invented_data.4
    label: pass
    note: The account fact comes from the customer lookup.
    transcript:
      - { role: user, text: "What plan am I on? It's jordan.lee@example.com" }
      - { role: tool_call, tool: customer.lookup, text: '{"email":"jordan.lee@example.com"}' }
      - { role: tool_result, tool: customer.lookup, text: '{"name":"Jordan Lee","plan":"Acme Mobile S"}' }
      - { role: agent, text: "Jordan, you are on Acme Mobile S." }
