# The label audit: a seeded sample of each family of gated blocks, for a person to read against the spec.
# For each block, set label_correct to true or false and say why in note. The error rate per family is
# the share of false answers, reported with its interval once the sample is read.
families:
  - family: boundary
    sample:
      - block: gen-boundary-058#b1-needs-to-identify
        path: boundary/gen-boundary-058.yaml
        cell:
          stage_transition: needs-to-identify
          stage: identify
        when: I keep running out of data, can I get a bigger plan?
        expected:
          stage: identify
          tools:
            - label: catalog.search
              count: 0
            - label: order.create
              count: 0
          lang: EN
          criteria:
            - flow.upgrade
        label_correct: null
        note: null
      - block: gen-boundary-060#b2-identify-to-offer
        path: boundary/gen-boundary-060.yaml
        cell:
          stage_transition: identify-to-offer
          account_lookup: plan-not-in-catalog
          stage: offer
        when: It's lee.jensen@example.com.
        expected:
          stage: offer
          tools:
            - label: catalog.search
              count: 1
              input:
                category: mobile
                customer_email: lee.jensen@example.com
          lang: EN
        label_correct: null
        note: null
      - block: gen-boundary-079#b3-offer-to-callback
        path: boundary/gen-boundary-079.yaml
        cell:
          stage_transition: offer-to-callback
          stage: callback
        when: Can someone just call me back?
        expected:
          stage: callback
          tools:
            - label: coverage.check
              count: 0
            - label: catalog.search
              count: 0
            - label: notify_sales
              count: 0
          lang: EN
        label_correct: null
        note: null
