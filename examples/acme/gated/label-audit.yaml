        label_correct: null
        note: null
      - block: gen-cover-013#b5-recap-to-order_placed
        path: cover/gen-cover-013.yaml
        cell:
          stage_transition: recap-to-order_placed
          coverage_result: 5g-only
          customer_details: name-and-email
          stage: order_placed
        when: CONFIRM
        expected:
          stage: order_placed
          tools:
            - label: order.create
              count: 1
              input:
                type: new
                plan_id: air-5g
                address_id: addr-103
                customer:
                  subset:
                    name: Jo Okafor
                    email: jo.okafor@example.com
            - label: coverage.check
              count: 0
            - label: catalog.search
              count: 0
          lang: EN
        label_correct: null
        note: null
      - block: gen-cover-029#b4-callback-to-handover
        path: cover/gen-cover-029.yaml
        cell:
          stage_transition: callback-to-handover
          callback_phone: given
          coverage_result: fiber
          plan_choice: asks-for-callback
          stage: handover
        when: You can reach me on +1 202 555 0131.
        expected:
          stage: handover
          tools:
            - label: notify_sales
              count: 1
              input:
                reason: callback
                customer:
                  subset:
                    phone: "+12025550131"
            - label: coverage.check
              count: 0
            - label: catalog.search
              count: 0
          lang: EN
        label_correct: null
        note: null
