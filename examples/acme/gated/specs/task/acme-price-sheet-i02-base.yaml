blocks:
  - id: build
    when:
      user: "Please turn catalog.json into a price sheet: one sheet for each category (Mobile, Office, Travel and Home), the columns Plan, Allowance, Monthly price (USD) and Yearly price (USD), and a row for every catalog line, in the order of the catalog. Compute the yearly price with a formula, twelve times the monthly price. Save the workbook as out/acme-prices.xlsx."
    expect:
      stage: build_sheet
      must:
        - acme-prices\.xlsx
      skills:
        - name: xlsx
          count:
            min: 1
      guards:
        - name: no_destructive_ops
          verdict: pass
      execution:
        ran_code: true
        exit_code: 0
        max_commands: 10
      artifacts:
