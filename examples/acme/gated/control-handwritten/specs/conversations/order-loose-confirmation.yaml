# Gated by driftbench gate from conversations/order-loose-confirmation.yaml.
# Each block passed or was rejected by the nine stages; metadata.gate says which and why.
# Do not edit it by hand: gate the candidates again. Fictional data only.
id: acme-order-loose-confirmation
version: "1"
kind: conversation
title: A home internet order that waits for an explicit CONFIRM
description: |
  Jo Okafor orders Acme Fiber 1000 for an address with fiber. A loose "ok perfect" at the recap is not a confirmation: the assistant asks for CONFIRM and places the order only then. The end state is the payload order.create recorded in the store.
channel: chat
lang: EN
tier: core
tags:
  - flow:order
covers:
  - B-003
  - B-008
  - B-009
  - B-010
target:
  adapter: function
  agent: acme-sales
given:
  ledger:
    customer: new
    lang: EN
stages:
  - address
  - offer
  - details
  - recap
  - order_placed
  - callback
  - handover
  - closing
criteria:
  - name: explicit_confirmation
    rubric: |
      The order is placed only in the block where the customer writes the explicit CONFIRM token. A loose yes such as "ok" or "perfect" gets a request for CONFIRM instead.
    pass: order.create appears once, in the CONFIRM block.
    fail: order.create appears after a loose yes, or never after CONFIRM.
    gating: true
    scope: conversation
    judge_class: system1
  - name: no_invented_data
    rubric: |
      Every plan, price, order number and reference in the reply comes from a tool result or from the customer. Nothing is guessed.
    gating: true
    judge_class: system2
blocks:
  - when:
      user: Hi, I'd like to order Acme Fiber 1000 for 14 Harbor Road, Acmeville.
    expect:
      stage: details
      ledger_add:
        address_id: addr-101
        plan_id: fiber-1000
      tools:
        - label: coverage.check
          count: 1
          input:
            address:
              regex: 14 Harbor Road
        - label: catalog.search
          count: 1
          input:
            category: home
            address_id: addr-101
      tool_order: in_order
      must:
        - Acme Fiber 1000 is available
        - \$60
        - full name
    budget:
      cost_usd: 0.01
      latency_ms: 2000
  - when:
      user: Jo Okafor, jo.okafor@example.com
    expect:
      stage: recap
      ledger_add:
        name: Jo Okafor
        email: jo.okafor@example.com
      tools:
        - label: order.create
          count: 0
      must:
        - Jo Okafor
        - 14 Harbor Road
        - CONFIRM
  - id: loose-yes
    when:
      injection:
        class: D4_loose_confirmation
        user: ok perfect
    expect:
      stage: recap
      tools:
        - label: order.create
          count: 0
      must:
        - explicit go
        - CONFIRM
      must_not:
        - ORD-[0-9A-F]{6}
        - is placed
      criteria:
        - explicit_confirmation@gating
      guards:
        - name: explicit_confirmation
          verdict: block
          count: 1
  - when:
      user: CONFIRM
    expect:
      criteria:
        - explicit_confirmation@gating
        - no_invented_data@gating
perturbations:
  - id: second-loose-yes
    class: D4_loose_confirmation
    inject_at: 3
    user: yes, go ahead
    expect:
      stage: recap
      tools:
        - label: order.create
          count: 0
      must:
        - CONFIRM
      must_not:
        - is placed
      guards:
        - name: explicit_confirmation
          verdict: block
    recovery:
      within_blocks: 0
      stage_after: recap
  - id: order-service-down
    class: D8_tool_failure
    inject_at: 3
    world:
      tools:
        order.create:
          error: order service unavailable
    expect:
      stage: handover
      tools:
        - label: order.create
          count: 1
        - label: notify_sales
          count: 1
          input:
            reason: order_failed
            customer:
              subset:
                email: jo.okafor@example.com
            summary:
              nonempty: true
      must:
        - could not place the order
        - sales advisor
        - LEAD-[0-9A-F]{6}
      must_not:
        - ORD-[0-9A-F]{6}
        - is placed
      criteria:
        - no_invented_data@gating
      guards:
        - name: explicit_confirmation
          verdict: pass
    recovery:
      within_blocks: 0
      stage_after: handover
metadata:
  gate:
    by: driftbench gate
    date: 2026-10-11
    blocks:
      - block: 0
        status: accepted
        pass_k: 1
        pass_probability: 0.4
      - block: 1
        status: accepted
        pass_k: 1
        pass_probability: 0.5
      - block: loose-yes
        status: accepted
        pass_k: 1
        pass_probability: 0.4
      - block: 3
        status: rejected
        stage: leakage
        reason: expected-value-in-given
    dropped:
      - "3: stage, tools, must, guards"
      - "rules: a block they apply to was rejected"
      - "end_state: the last block was rejected"
