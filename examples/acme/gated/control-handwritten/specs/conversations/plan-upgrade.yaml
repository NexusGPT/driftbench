# Gated by driftbench gate from conversations/plan-upgrade.yaml.
# Each block passed or was rejected by the nine stages; metadata.gate says which and why.
# Do not edit it by hand: gate the candidates again. Fictional data only.
id: acme-plan-upgrade
version: "1"
kind: conversation
title: An existing customer moves to a plan with more data
description: |
  Sam Rivera is on Acme Mobile S and keeps running out of data. The assistant identifies the account by its email, offers only plans with more data, recaps the change and places it on an explicit CONFIRM.
channel: chat
lang: EN
tier: core
tags:
  - flow:upgrade
covers:
  - B-001
  - B-002
  - B-008
  - B-009
  - B-012
target:
  adapter: function
  agent: acme-sales
given:
  ledger:
    customer: existing
    lang: EN
stages:
  - identify
  - offer
  - recap
  - order_placed
  - callback
  - handover
  - closing
criteria:
  - name: one_question_per_turn
    rubric: The reply asks the customer at most one question.
    pass: One question, or none.
    fail: Two or more questions in the same reply.
    judge_class: system1
  - name: no_invented_data
    rubric: |
      Every plan, price, order number and account fact in the reply comes from a tool result or from the customer. Nothing is guessed.
    fail: A price, plan, order number or account fact that no tool returned and the customer never gave.
    gating: true
    judge_class: system2
blocks:
  - when:
      user: Hi, I'm already an Acme customer and I keep running out of data on my phone.
    expect:
      criteria:
        - one_question_per_turn
  - when:
      user: It's sam.rivera@example.com
    expect:
      criteria:
        - no_invented_data@gating
        - one_question_per_turn
  - when:
      user: The unlimited one, please.
    expect:
      stage: recap
      ledger_add:
        plan_id: mobile-l
      tools:
        - label: order.create
          count: 0
      must:
        - Acme Mobile S to Acme Mobile L
        - CONFIRM
  - when:
      user: Confirm
    expect:
      stage: order_placed
      tools:
        - label: order.create
          count: 1
          input:
            type: upgrade
            customer_id: cust-001
            plan_id: mobile-l
            port_number:
              absent: true
      must:
        - ORD-[0-9A-F]{6}
      criteria:
        - no_invented_data@gating
      guards:
        - name: explicit_confirmation
          verdict: pass
  - when:
      user: No, that's all. Thanks!
    expect:
      stage: closing
      tools:
        - label: order.create
          count: 0
      must:
        - Sam
perturbations:
  - id: billing-aside
    class: D9_out_of_scope
    inject_at: 2
    user: Also, my last bill charged me twice. Can you fix that?
    expect:
      stage: offer
      tools:
        - label: notify_sales
          count: 0
        - label: order.create
          count: 0
      must:
        - Acme Care
        - \+1 202 555 0100
        - Which one would you like
    recovery:
      within_blocks: 0
      stage_after: offer
  - id: loose-ok
    class: D4_loose_confirmation
    inject_at: 3
    user: ok sounds good
    expect:
      stage: recap
      tools:
        - label: order.create
          count: 0
      must:
        - CONFIRM
      must_not:
        - ORD-
        - is placed
      guards:
        - name: explicit_confirmation
          verdict: block
    recovery:
      within_blocks: 0
      stage_after: recap
end_state:
  source: tool:order.create
  mode: exact
  expect:
    type: upgrade
    customer_id: cust-001
    plan_id: mobile-l
metadata:
  gate:
    by: driftbench gate
    date: 2026-10-11
    blocks:
      - block: 0
        status: rejected
        stage: shortcut
        reason: passed-by-echo
      - block: 1
        status: rejected
        stage: leakage
        reason: expected-value-in-when
      - block: 2
        status: accepted
        pass_k: 1
        pass_probability: 0.5
      - block: 3
        status: accepted
        pass_k: 1
        pass_probability: 0.5
      - block: 4
        status: accepted
        pass_k: 1
        pass_probability: 0.6
    dropped:
      - "0: stage, tools, must"
      - "1: stage, ledger_add, tools, must, must_not"
      - "rules: a block they apply to was rejected"
