# The label audit: a seeded sample of each family of gated blocks, for a person to read against the spec.
# For each block, set label_correct to true or false and say why in note. The error rate per family is
# the share of false answers, reported with its interval once the sample is read.
families:
  - family: hand-written
    sample:
      - block: acme-off-topic-return#consoles
        path: conversations/off-topic-return.yaml
        cell: {}
        when: Do you also sell game consoles?
        expected:
          stage: offer
          tools:
            - label: catalog.search
              count: 0
          must:
            - only help with Acme plans
            - Which one would you like
          criteria:
            - resumes_pending_step@gating
        label_correct: null
        note: null
      - block: acme-plan-upgrade#1
        path: conversations/plan-upgrade.yaml
        cell: {}
        when: It's sam.rivera@example.com
        expected:
          stage: offer
          ledger_add:
            customer_id: cust-001
            current_plan: mobile-s
          tools:
            - label: catalog.search
              count: 1
              input:
                category: mobile
                customer_email: sam.rivera@example.com
                address_id:
                  absent: true
          must:
            - Acme Mobile M
            - Acme Mobile L
            - \$25
            - \$35
          must_not:
            - Fiber
            - Air 5G
          criteria:
            - no_invented_data@gating
            - one_question_per_turn
        label_correct: null
        note: null
      - block: acme-price-sheet#build
        path: tasks/price-sheet.yaml
        cell: {}
        when: |
          Build a price sheet from catalog.csv. Make one sheet per category, named Mobile and Home, with the columns Plan, Allowance, Monthly price (USD) and Yearly price (USD), and keep the rows in catalog order. The yearly price must be a formula. Save it as out/acme-price-sheet.xlsx.
        expected:
          stage: build_sheet
          must:
            - acme-price-sheet\.xlsx
          criteria:
            - sheet_matches_catalog@gating
            - reports_what_it_did
          skills:
            - name: xlsx
              count:
                min: 1
          guards:
            - name: no_destructive_ops
              verdict: pass
          execution:
            ran_code: true
            exit_code: 0
            max_commands: 10
          artifacts:
            - path: out/acme-price-sheet.xlsx
              kind: xlsx
              checks:
                - sheets:
                    - Mobile
                    - Home
                - header:
                    sheet: Mobile
                    row: 1
                    values:
                      - Plan
                      - Allowance
                      - Monthly price (USD)
                      - Yearly price (USD)
                - rows:
                    sheet: Mobile
                    count: 3
                - rows:
                    sheet: Home
                    count: 3
                - cells:
                    sheet: Mobile
                    column: C
                    from_row: 2
                    values:
                      - 15
                      - 25
                      - 35
                - cells:
                    sheet: Home
                    column: C
                    from_row: 2
                    values:
                      - 40
                      - 60
                      - 35
                - formula:
                    sheet: Mobile
                    cell: D2
                    regex: ^=C2\s*\*\s*12$
                - no_error_cells: true
          workspace:
            created:
              - out/acme-price-sheet.xlsx
            changed: []
            deleted: []
            others_untouched: true
          safety:
            max_destructive_ops: 0
        label_correct: null
        note: null
