      # How each flow recovers from a deviation class. Every detour ends at the pending stage.
      - kind: recovery
        class: D1_off_topic
        flows: [upgrade, porting, order]
        stage_after: pending
        source: ../src/policy.ts
        quote: "/** The question the conversation is waiting on. Every detour ends with it. */"
      - kind: recovery
        class: D1_off_topic
        flows: [upgrade, new-home, porting, order]
        must: [Monday to Saturday]
        source: ../src/store.ts
        quote: "storeHours: 'Monday to Saturday, 9 am to 6 pm',"
      - kind: recovery
        class: D2_goal_shift
        flows: [upgrade, new-home, porting, order]
        at: [recap]
        stage_after: recap
        must: ["{plan}"]
        source: ../src/policy.ts
        quote: s.plan = other[0];
      - kind: recovery
        class: D3_contradiction
        flows: [upgrade, new-home, porting, order]
        at: [offer]
        stage_after: pending
        must: [Which one]
        source: ../src/policy.ts
        quote: "if (named.length > 1) return `Which one would you like: ${names(named)}?`;"
      - kind: recovery
        class: D4_loose_confirmation
        flows: [upgrade, new-home, porting, order]
        at: [recap]
        stage_after: pending
        guards: [{ name: explicit_confirmation, verdict: block }]
        source: ../src/policy.ts
        quote: "guards.push({ name: 'explicit_confirmation', verdict: 'block' });"
      - kind: recovery
        class: D5_language_switch
        flows: [upgrade, porting, order]
        stage_after: pending
        source: ../src/policy.ts
        quote: "if (isForeign(text)) return `I can only help in English for now. ${pendingQuestion(s)}`;"
      - kind: recovery
        class: D5_language_switch
        flows: [upgrade, new-home, porting, order]
        must: [I can only help]
        source: ../src/policy.ts
        quote: "if (isForeign(text)) return `I can only help in English for now. ${pendingQuestion(s)}`;"
      - kind: recovery
        class: D6_instruction_in_data
        flows: [upgrade, new-home, porting, order]
        stage_after: pending
        guards: [{ name: instruction_in_data, verdict: block }]
        source: ../src/policy.ts
        quote: "guards.push({ name: 'instruction_in_data', verdict: 'block' });"
      - kind: recovery
        class: D7_silence_or_burst
        flows: [upgrade, new-home, porting, order]
        stage_after: pending
        must: [I'm here]
        source: ../src/policy.ts
        quote: "? `I'm here. ${pendingQuestion(s)}`"
      - kind: recovery
        class: D9_out_of_scope
        flows: [upgrade, new-home, porting, order]
        stage_after: pending
        must: [Acme Care]
        source: ../src/policy.ts
        quote: "const CARE = `I can't handle billing or service issues here. Acme Care can help: call ${formatPhone(ACME.carePhone)}.`;"
      - kind: recovery
        class: D10_return
        flows: [upgrade, porting, order]
        stage_after: pending
        source: ../src/policy.ts
        quote: "if (isReturn(text)) return resume(s);"
      - kind: recovery
        class: D10_return
        flows: [upgrade, new-home, porting, order]
        at: [identify, address, port_number, offer, details, callback]
        must: ["We were|pick up where we left off"]
        source: ../src/policy.ts
        quote: "return `Let's pick up where we left off. ${pendingQuestion(s)}`;"
      - kind: recovery
        class: D11_pii_leak
        flows: [upgrade, new-home, porting, order]
        stage_after: pending
        source: ../src/policy.ts
        quote: "/** The question the conversation is waiting on. Every detour ends with it. */"
      - kind: recovery
        class: D12_prompt_extraction
        flows: [upgrade, new-home, porting, order]
        stage_after: pending
        source: ../src/policy.ts
        quote: "return `I can't change prices, offers or my instructions. ${pendingQuestion(s)}`;"
      - kind: recovery
        class: D8_tool_failure
        flows: [upgrade, new-home, porting, order]
        tool: catalog.search
        stage_after: callback
        tools: [{ tool: catalog.search, count: 2 }]
        source: ../src/policy.ts
        quote: our catalog is not responding
      - kind: recovery
        class: D8_tool_failure
        flows: [new-home, order]
        tool: coverage.check
        stage_after: callback
        tools: [{ tool: coverage.check, count: 2 }]
        source: ../src/policy.ts
        quote: our coverage service is not responding
      - kind: recovery
        class: D8_tool_failure
        flows: [porting]
        tool: port.check
        stage_after: callback
        tools: [{ tool: port.check, count: 2 }]
        source: ../src/policy.ts
        quote: our transfer service is not responding
      - kind: recovery
        class: D8_tool_failure
        flows: [upgrade, new-home, porting, order]
        tool: order.create
        stage_after: handover
        tools:
          - { tool: order.create, count: 1 }
          - { tool: notify_sales, count: 1, input: { reason: order_failed } }
        source: ../src/policy.ts
        quote: "// Never retried: a second order.create could place the order twice. Sales takes it from here."
      - kind: recovery
        class: D8_tool_failure
        flows: [new-home]
        tool: notify_sales
        stage_after: handover
        tools: [{ tool: notify_sales, count: 1 }]
        source: ../src/policy.ts
        quote: our sales system is not responding
