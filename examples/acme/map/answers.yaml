        source: ../src/store.ts
        quote: "{ id: 'addr-101', label: '14 Harbor Road, Acmeville', fiber_mbps: 1000, five_g: true },"
      - kind: binds
        subject: { dimension: coverage_result, value: 5g-only }
        slots: { address: "88 Summit Avenue, Acmeville", address_id: addr-103 }
        source: ../src/store.ts
        quote: "{ id: 'addr-103', label: '88 Summit Avenue, Acmeville', fiber_mbps: 0, five_g: true },"
      - kind: binds
        subject: { dimension: coverage_result, value: no-service }
        slots: { address: "7 Quarry Lane, Acmeville", address_id: addr-104 }
        source: ../src/store.ts
        quote: "{ id: 'addr-104', label: '7 Quarry Lane, Acmeville', fiber_mbps: 0, five_g: false },"
      - kind: binds
        subject: { dimension: coverage_result, value: not-in-map }
        slots: { address: "21 Willow Court, Acmeville" }
        source: ../src/policy.ts
        quote: in our coverage map
      - kind: binds
        subject: { dimension: port_result, value: can-move }
        slots: { number: "+1 202 555 0165", number_e164: "+12025550165" }
        source: ../src/store.ts
        quote: "{ number: '+12025550165', eligible: true },"
      - kind: binds
        subject: { dimension: port_result, value: locked }
        slots: { number: "+1 202 555 0160", number_e164: "+12025550160" }
        source: ../src/store.ts
        quote: |-
          number: '+12025550160',
          eligible: false,
          reason: 'the number has a transfer lock at its current carrier',
      - kind: binds
        subject: { dimension: customer_details, value: name-and-email }
