          - 'Acme Fiber 1000, 1000 Mbps for \$60 a month'
          - 'Acme Air 5G, up to 200 Mbps for \$35 a month'
        source: ../src/policy.ts
        quote: "const price = `for $${plan.monthly_usd} a month`;"
      - kind: states
        subject: { dimension: flow, value: new-home }
        stage: address
        to: offer
        when: { coverage_result: [5g-only] }
