        source: ../src/policy.ts
        quote: "if (s.customer.name && s.customer.email) return recap(s);"
      - kind: binds
        subject: { dimension: callback_phone, value: given }
        slots: { phone: "+1 202 555 0131", phone_e164: "+12025550131" }
        source: ../src/policy.ts
        quote: s.customer.phone = phone;

      # The language every reply is in.
      - kind: reply_language
        subject: { dimension: rule, value: english-only }
        lang: en
        source: ../src/policy.ts
        quote: "if (isForeign(text)) return `I can only help in English for now. ${pendingQuestion(s)}`;"

      # Each flow's stage order on its branches, and what the store holds at the end.
      - kind: path
        id: upgrade-order
        flow: upgrade
        when: { user_type: [existing-customer], account_lookup: [found], plan_choice: [names-one] }
        stages: [needs, identify, offer, recap, order_placed, closing]
        behaviours: [B-001, B-002, B-008]
        end_state:
          source: tool:order.create
          mode: subset
          expect: { type: upgrade, customer_id: "{customer_id}", plan_id: "{plan_id}" }
        source: ../src/policy.ts
        quote: "if (s.flow === 'upgrade' || (s.customer.name && s.customer.email)) return recap(s);"
      - kind: path
        id: upgrade-unknown-email
        flow: upgrade
        when: { user_type: [existing-customer], account_lookup: [not-found] }
        stages: [needs, identify, identify]
        behaviours: [B-001]
        source: ../src/policy.ts
        quote: "I can't find an Acme account with ${email}. Please check the email address on your Acme account."
      - kind: path
        id: upgrade-most-data
        flow: upgrade
        when: { user_type: [existing-customer], account_lookup: [most-data] }
        stages: [needs, identify, closing]
        behaviours: [B-002]
        source: ../src/policy.ts
        quote: which already has the most data
      - kind: path
        id: upgrade-plan-not-in-catalog
        flow: upgrade
        when: { user_type: [existing-customer], account_lookup: [plan-not-in-catalog] }
        stages: [needs, identify, offer]
        behaviours: [B-001]
        source: ../src/policy.ts
        quote: "return `Thanks, ${name}. Our mobile plans: ${list(catalog.plans)}. ${offerQuestion(s)}`;"
      - kind: path
        id: home-order
        flow: new-home
        when: { user_type: [new-customer], coverage_result: [fiber, 5g-only], plan_choice: [names-one], customer_details: [name-and-email] }
        stages: [needs, address, offer, details, recap, order_placed]
        behaviours: [B-003, B-004]
        end_state:
          source: tool:order.create
          mode: subset
          expect:
            type: new
            plan_id: "{plan_id}"
            address_id: "{address_id}"
            customer: { subset: { name: "{name}", email: "{email}" } }
        source: ../src/policy.ts
        quote: "// Home internet: coverage first, then the plans available at the address."
      - kind: path
        id: home-no-coverage
        flow: new-home
        when: { user_type: [new-customer], coverage_result: [no-service], callback_phone: [given] }
        stages: [needs, address, callback, handover, closing]
        behaviours: [B-003, B-005]
        end_state:
          source: tool:notify_sales
          mode: subset
          expect: { reason: no_coverage, customer: { subset: { phone: "{phone_e164}" } } }
        source: ../src/policy.ts
        quote: "if (coverage.fiber_mbps === 0 && !coverage.five_g) return askPhone(s, noCoverage, unreachable);"
      - kind: path
        id: home-address-not-found
        flow: new-home
        when: { user_type: [new-customer], coverage_result: [not-in-map] }
        stages: [needs, address, address]
        behaviours: [B-003]
        source: ../src/policy.ts
        quote: in our coverage map
      - kind: path
        id: home-callback
        flow: new-home
        when: { user_type: [new-customer], coverage_result: [fiber, 5g-only], plan_choice: [asks-for-callback], callback_phone: [given] }
        stages: [needs, address, offer, callback, handover]
        behaviours: [B-004, B-005]
        end_state:
          source: tool:notify_sales
          mode: subset
          expect: { reason: callback, customer: { subset: { phone: "{phone_e164}" } } }
        source: ../src/policy.ts
        quote: "'Sure. A sales advisor can call you back. What phone number should they use?',"
      - kind: path
        id: porting-keep-number
        flow: porting
        when: { user_type: [new-customer], port_result: [can-move], plan_choice: [names-one], customer_details: [name-and-email] }
        stages: [needs, port_number, offer, details, recap, order_placed]
        behaviours: [B-006, B-008]
        end_state:
          source: tool:order.create
          mode: subset
          expect:
            type: new
            plan_id: "{plan_id}"
            port_number: "{number_e164}"
            customer: { subset: { name: "{name}", email: "{email}" } }
        source: ../src/policy.ts
        quote: "// Porting: check the number, then a mobile plan."
      - kind: path
        id: porting-locked-number
        flow: porting
        when: { user_type: [new-customer], port_result: [locked], plan_choice: [names-one], customer_details: [name-and-email] }
        stages: [needs, port_number, offer, details, recap, order_placed, closing]
        behaviours: [B-006, B-007, B-008]
        end_state:
          source: tool:order.create
          mode: subset
          expect:
            type: new
            plan_id: "{plan_id}"
            port_number: { absent: true }
            customer: { subset: { name: "{name}", email: "{email}" } }
        source: ../src/policy.ts
        quote: You can ask your current carrier to remove the lock, or take a new Acme number.
      - kind: path
        id: order-named-plan
        flow: order
        when: { coverage_result: [fiber], plan_choice: [names-one], customer_details: [name-and-email] }
        stages: [needs, address, offer, details, recap, order_placed]
        behaviours: [B-008, B-010]
        end_state:
          source: tool:order.create
          mode: subset
          expect:
            type: new
            plan_id: "{plan_id}"
            address_id: "{address_id}"
            customer: { subset: { name: "{name}", email: "{email}" } }
        source: ../inventory.yaml
        quote: "title: Recap, explicit confirmation and order placement"
      - kind: path
        id: order-single-plan
        flow: order
        when: { coverage_result: [5g-only], plan_choice: [loose-yes-to-single-offer], customer_details: [name-and-email] }
        stages: [needs, address, offer, details, recap, order_placed, closing]
        behaviours: [B-008]
        end_state:
          source: tool:order.create
          mode: subset
          expect:
            type: new
            plan_id: "{plan_id}"
            address_id: "{address_id}"
            customer: { subset: { name: "{name}", email: "{email}" } }
        source: ../src/policy.ts
        quote: "if (only && isLooseYes(text)) return choosePlan(s, only);"

      # The tools each flow calls, the stage it calls them at, and what feeds their arguments.
      - kind: uses_tool
        subject: { dimension: flow, value: upgrade }
        tool: catalog.search
        stage: identify
        input: { category: mobile, customer_email: "{email}" }
        source: ../src/policy.ts
        quote: "callWithRetry(call, 'catalog.search', { category: 'mobile', customer_email: email }),"
      - kind: uses_tool
        subject: { dimension: flow, value: upgrade }
        tool: order.create
        stage: recap
        to: order_placed
        input: { type: upgrade, customer_id: "{customer_id}", plan_id: "{plan_id}" }
        source: ../src/policy.ts
        quote: "if (s.flow === 'upgrade') return { type: 'upgrade', customer_id: s.customer.id, plan_id: plan.id };"
      - kind: uses_tool
        subject: { dimension: flow, value: new-home }
        tool: coverage.check
        stage: address
        input: { address: "{address}" }
        source: ../src/policy.ts
        quote: "const coverage = readCoverage(callWithRetry(call, 'coverage.check', { address }));"
      - kind: uses_tool
        subject: { dimension: flow, value: new-home }
        tool: catalog.search
        stage: address
        when: { coverage_result: [fiber, 5g-only] }
        input: { category: home, address_id: "{address_id}" }
        source: ../src/policy.ts
        quote: "callWithRetry(call, 'catalog.search', { category: 'home', address_id: coverage.address_id }),"
      - kind: uses_tool
        subject: { dimension: flow, value: new-home }
        tool: order.create
        stage: recap
        to: order_placed
        input:
          type: new
          plan_id: "{plan_id}"
          address_id: "{address_id}"
          customer: { subset: { name: "{name}", email: "{email}" } }
        source: ../src/policy.ts
        quote: "return { type: 'new', plan_id: plan.id, address_id: s.coverage?.address_id, customer };"
      - kind: uses_tool
        subject: { dimension: flow, value: new-home }
        tool: notify_sales
        stage: callback
        to: handover
        when: { coverage_result: [no-service] }
        input: { reason: no_coverage, customer: { subset: { phone: "{phone_e164}" } } }
        source: ../src/policy.ts
        quote: "reason: 'no_coverage',"
      - kind: uses_tool
        subject: { dimension: flow, value: new-home }
        tool: notify_sales
        stage: callback
        to: handover
        when: { coverage_result: [fiber, 5g-only], plan_choice: [asks-for-callback] }
        input: { reason: callback, customer: { subset: { phone: "{phone_e164}" } } }
        source: ../src/policy.ts
        quote: "{ reason: 'callback', summary },"
      - kind: uses_tool
        subject: { dimension: flow, value: order }
        tool: coverage.check
        stage: address
        input: { address: "{address}" }
        source: ../src/policy.ts
        quote: "const coverage = readCoverage(callWithRetry(call, 'coverage.check', { address }));"
      - kind: uses_tool
        subject: { dimension: flow, value: order }
        tool: catalog.search
        stage: address
        when: { coverage_result: [fiber, 5g-only] }
        input: { category: home, address_id: "{address_id}" }
        source: ../src/policy.ts
        quote: "callWithRetry(call, 'catalog.search', { category: 'home', address_id: coverage.address_id }),"
      - kind: uses_tool
        subject: { dimension: flow, value: order }
        tool: order.create
        stage: recap
        to: order_placed
        input:
          type: new
          plan_id: "{plan_id}"
          address_id: "{address_id}"
          customer: { subset: { name: "{name}", email: "{email}" } }
        source: ../src/policy.ts
        quote: "return { type: 'new', plan_id: plan.id, address_id: s.coverage?.address_id, customer };"
      - kind: uses_tool
        subject: { dimension: flow, value: porting }
        tool: port.check
        stage: port_number
        input: { number: "{number_e164}" }
        source: ../src/policy.ts
        quote: "const port = readPort(callWithRetry(call, 'port.check', { number }));"
      - kind: uses_tool
        subject: { dimension: flow, value: porting }
        tool: catalog.search
        stage: port_number
        input: { category: mobile }
        source: ../src/policy.ts
        quote: "const catalog = readCatalog(callWithRetry(call, 'catalog.search', { category: 'mobile' }));"
      - kind: uses_tool
        subject: { dimension: flow, value: porting }
        tool: order.create
        stage: recap
        to: order_placed
        when: { port_result: [can-move] }
        input:
          type: new
          plan_id: "{plan_id}"
          port_number: "{number_e164}"
          customer: { subset: { name: "{name}", email: "{email}" } }
        source: ../src/policy.ts
        quote: "? { type: 'new', plan_id: plan.id, customer, port_number: s.portNumber }"
      - kind: uses_tool
        subject: { dimension: flow, value: porting }
        tool: order.create
        stage: recap
        to: order_placed
        when: { port_result: [locked] }
        input:
          type: new
          plan_id: "{plan_id}"
          port_number: { absent: true }
          customer: { subset: { name: "{name}", email: "{email}" } }
        source: ../src/policy.ts
        quote: ": { type: 'new', plan_id: plan.id, customer };"

      # The price-sheet flow is a code-agent task: a task family writes its specs, with an oracle in code.
      # Its start knob splits it in two branches: the price sheet built from the catalog, and the summary
      # added to a workbook the workspace already holds.
      - kind: task_family
        flow: price-sheet
        family: ../families/price-sheet
        stages: [build_sheet, add_summary]
        holds: { user_type: [sales-operations], workspace_start: [catalog-only] }
        instances: { start: catalog-only }
        deviations: [D6_instruction_in_data]
        source: ../README.md
        quote: "its stage, `build_sheet` or `add_summary`"
      - kind: task_family
        flow: price-sheet
        family: ../families/price-sheet
        stages: [add_summary]
        holds: { user_type: [sales-operations], workspace_start: [existing-workbook] }
        instances: { start: existing-workbook }
        source: ../inventory.yaml
        quote: "title: Add a summary sheet to the existing workbook and leave every other file untouched"

      # What the reply that enters the offer states: each plan with its monthly price, as catalog.search returns it.
      - kind: states
