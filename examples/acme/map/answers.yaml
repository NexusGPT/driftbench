# The model's part of the Acme map, written by hand under the same answer contract a model gets
# (SYSTEM_PROMPT in packages/generate/src/extract/contract.ts): one answer per section, every entry with a
# source and a quote copied from it. No model key was set when the map was made, so the lanes played the
# model: the extract lane wrote the first five sections, the generate2 lane the stage transition and
# deviation phrases, the behaviour and user type constraints, and the relations section. The family is
# `lane`, so no one mistakes these entries for a tool run; the lanes ran on claude-opus-5-5. Replayed by:
#   pnpm driftbench extract --prompt examples/acme/src/policy.ts --prompt examples/acme/README.md \
#     --prompt examples/acme/src/store.ts --inventory examples/acme/inventory.yaml \
#     --tools examples/acme/map/tools.yaml --replay examples/acme/map/answers.yaml \
#     --out examples/acme/map/proposal.yaml --force
# Each answer object is sent as its JSON text, exactly as a model would have answered.
family: lane
model: claude-opus-5-5 as the extract and generate2 lanes, by hand
answers:
  stages:
    section: stages
    dimensions:
      - id: stage
        title: The flow stage a turn ends in
        kind: stage
        values:
          - id: needs
            title: The agent asks what the customer is looking for
            source: ../src/policy.ts
            quote: "const NEEDS = 'What are you looking for: a mobile plan, home internet, an upgrade, or keeping your number?';"
          - id: identify
            title: The agent asks for the email on the Acme account
            source: ../src/policy.ts
            quote: "return 'What is the email address on your Acme account?';"
          - id: address
            title: The agent asks for the street address
            source: ../src/policy.ts
            quote: "return 'What is the street address?';"
          - id: port_number
            title: The agent asks which number moves to Acme
            source: ../src/policy.ts
            quote: "return 'Which number do you want to bring to Acme?';"
          - id: offer
            title: The agent lists plans and asks which one
            source: ../src/policy.ts
            quote: "s.stage = 'offer';"
          - id: details
            title: The agent asks for the full name and email of a new customer
            source: ../src/policy.ts
            quote: "return 'To set up the order I need your full name and email address.';"
          - id: recap
            title: The agent recaps the order and waits for CONFIRM
            source: ../src/policy.ts
            quote: "return 'Reply CONFIRM to place the order, or tell me what to change.';"
          - id: order_placed
            title: The order is placed
            source: ../src/policy.ts
            quote: "s.stage = 'order_placed';"
          - id: callback
            title: The agent asks for a phone number so a sales advisor can call back
            source: ../src/policy.ts
            quote: "return 'What phone number should the advisor use?';"
          - id: handover
            title: The lead has gone to a sales advisor
            source: ../src/policy.ts
            quote: "s.stage = 'handover';"
          - id: closing
            title: The conversation closes
            source: ../src/policy.ts
            quote: "s.stage = 'closing';"
          - id: build_sheet
            title: The ops agent builds the price sheet workbook from the catalog
            source: ../README.md
            quote: "its stage, `build_sheet` or `add_summary`"
          - id: add_summary
            title: The ops agent adds the Summary sheet to the workbook
            source: ../README.md
            quote: "its stage, `build_sheet` or `add_summary`"
      - id: stage_transition
        title: A move from one stage to the next
        kind: behaviour
        values:
          - id: needs-to-identify
            title: An upgrade starts by asking for the account email
            source: ../src/policy.ts
            quote: "return `I can help you move to a plan with more data. ${pendingQuestion(s)}`;"
          - id: needs-to-address
            title: Home internet starts by asking for the address
            source: ../src/policy.ts
            quote: "return `I can check what is available at your address. ${pendingQuestion(s)}`;"
          - id: needs-to-port_number
            title: A switch that keeps the number starts by asking for the number
            source: ../src/policy.ts
            quote: "return `Happy to help you switch and keep your number. ${pendingQuestion(s)}`;"
          - id: needs-to-offer
            title: A new mobile line goes straight to the mobile plans
            source: ../src/policy.ts
            quote: "return offerMobile(s, call, 'Happy to help you get a new line.');"
          - id: identify-to-identify
            title: No account has that email, so the agent asks again
            source: ../src/policy.ts
            quote: "return `I can't find an Acme account with ${email}. Please check the email address on your Acme account.`;"
          - id: identify-to-offer
            title: The account is found and plans with more data exist
            source: ../src/policy.ts
            quote: "return `Thanks, ${name}. You are on ${describe(current)}. Plans with more data: ${list(upgrades)}. ${offerQuestion(s)}`;"
          - id: identify-to-closing
            title: The customer already has the plan with the most data
            source: ../src/policy.ts
            quote: "return `Thanks, ${name}. You are on ${describe(current)}, which already has the most data. Is there anything else I can help with?`;"
          - id: address-to-address
            title: The address is not in the coverage map, so the agent asks again
            source: ../src/policy.ts
            quote: "return `I can't find ${s.address} in our coverage map. Please give the street number, street name and town, for example 14 Harbor Road, Acmeville.`;"
          - id: address-to-offer
            title: The address is covered and the agent lists its plans
            source: ../src/policy.ts
            quote: "return `${coverageSentence(coverage)} ${plans} ${offerQuestion(s)}`;"
          - id: address-to-details
            title: The first message named one plan available at the address
            source: ../src/policy.ts
            quote: "return `${named[0].name} is available at ${coverage.address}: ${terms(named[0])}. ${detailsQuestion(s)}`;"
          - id: address-to-callback
            title: No home internet at the address, so the agent offers a callback
            source: ../src/policy.ts
            quote: "if (coverage.fiber_mbps === 0 && !coverage.five_g) return askPhone(s, noCoverage, unreachable);"
          - id: port_number-to-offer
            title: The number check answers and the agent lists mobile plans
            source: ../src/policy.ts
            quote: "`Good news: ${shown} can move to Acme. The transfer takes one business day after your order.`"
          - id: offer-to-details
            title: A new customer picks a plan and the agent asks for details
            source: ../src/policy.ts
            quote: "return `Good choice: ${describe(plan)}. ${detailsQuestion(s)}`;"
          - id: offer-to-recap
            title: An upgrade, or a customer whose details are known, goes straight to the recap
            source: ../src/policy.ts
            quote: "if (s.flow === 'upgrade' || (s.customer.name && s.customer.email)) return recap(s);"
          - id: offer-to-callback
            title: The customer asks to be called back instead of choosing
            source: ../src/policy.ts
            quote: "'Sure. A sales advisor can call you back. What phone number should they use?',"
          - id: details-to-recap
            title: Name and email are known, so the agent recaps
            source: ../src/policy.ts
            quote: "if (s.customer.name && s.customer.email) return recap(s);"
          - id: recap-to-recap
            title: The customer names another offered plan at the recap
            source: ../src/policy.ts
            quote: "s.plan = other[0];"
          - id: recap-to-order_placed
            title: CONFIRM places the order
            source: ../src/policy.ts
            quote: "s.orderId = orderId;"
          - id: recap-to-handover
            title: The order fails and the request goes to a sales advisor
            source: ../src/policy.ts
            quote: "// Never retried: a second order.create could place the order twice. Sales takes it from here."
          - id: callback-to-handover
            title: The customer gives a phone number and the lead goes to sales
            source: ../src/policy.ts
            quote: "return `Done. A sales advisor will call you at ${formatPhone(phone)}${purpose(s, lead)}. Your reference is ${ticketId}.`;"
          - id: callback-to-offer
            title: The customer asks to retry the coverage check and it answers
            source: ../src/policy.ts
            quote: "if (isRetry(text) && canRetryCoverage(s)) return retryCoverage(s, call);"
          - id: order_placed-to-closing
            title: After the order, the customer says they are done
            source: ../src/policy.ts
            quote: |-
              case 'order_placed':
              case 'handover':
              case 'closing':
          - id: handover-to-closing
            title: After the handover, the customer says they are done
            source: ../src/policy.ts
            quote: "return `You're welcome${name ? `, ${name}` : ''}. Have a good day.`;"
    constraints:
      - forbid: { flow: upgrade, stage: details }
        reason: An upgrade goes from the chosen plan straight to the recap; it never asks for details
        source: ../src/policy.ts
        quote: "if (s.flow === 'upgrade' || (s.customer.name && s.customer.email)) return recap(s);"
      - forbid: { flow: upgrade, stage_transition: callback-to-offer }
        reason: Only the home flow retries a coverage check from the callback stage
        source: ../src/policy.ts
        quote: "return s.flow === 'home' && s.coverage === undefined && s.address !== undefined;"
      - forbid: { flow: porting, stage_transition: callback-to-offer }
        reason: Only the home flow retries a coverage check from the callback stage
        source: ../src/policy.ts
        quote: "return s.flow === 'home' && s.coverage === undefined && s.address !== undefined;"

  rules:
    section: rules
    dimensions:
      - id: rule
        title: A rule the agent follows that the inventory does not name
        kind: behaviour
        values:
          - id: facts-from-tools
            title: Facts come only from tool results and from the customer
            source: ../src/policy.ts
            quote: It reads facts only from tool results and from the customer.
          - id: retry-read-only-once
            title: A read-only tool gets one retry; a side-effecting tool none
            source: ../src/policy.ts
            quote: "/** Read-only tools get one retry; side-effecting tools never do. */"
          - id: order-never-retried
            title: A failed order is never retried; it goes to sales
            source: ../src/policy.ts
            quote: "// Never retried: a second order.create could place the order twice. Sales takes it from here."
          - id: lead-sent-once
            title: A lead goes to sales once, never retried
            source: ../src/policy.ts
            quote: "/** Sends the lead once, never retried. Returns the ticket id, or undefined when sales could not take it. */"
          - id: unreadable-is-failure
            title: A tool answer the agent cannot read counts as a failure; it never guesses
            source: ../src/policy.ts
            quote: "// Reading tool results. An answer the agent cannot read counts as a failure: it never guesses."
          - id: refuses-instructions
            title: An instruction in a message cannot change prices, offers or the agent's instructions
            source: ../src/policy.ts
            quote: "return `I can't change prices, offers or my instructions. ${pendingQuestion(s)}`;"
          - id: english-only
            title: The agent answers in English only
            source: ../src/policy.ts
            quote: "if (isForeign(text)) return `I can only help in English for now. ${pendingQuestion(s)}`;"
          - id: acme-plans-only
            title: A question outside Acme plans and orders gets a one-line refusal
            source: ../src/policy.ts
            quote: "if (isQuestion(text)) return `I can only help with Acme plans and orders. ${pendingQuestion(s)}`;"
          - id: store-hours
            title: The agent answers store hours, then returns to the pending question
            source: ../src/policy.ts
            quote: "return `Our stores are open ${ACME.storeHours}, and closed on Sunday. ${pendingQuestion(s)}`;"
          - id: greets-once
            title: The agent introduces itself once, in its first reply
            source: ../src/policy.ts
            quote: "const opening = state.greeted ? '' : `Hi, I'm the ${ACME.name} sales assistant. `;"
          - id: detours-end-with-pending-question
            title: Every detour ends with the question the conversation is waiting on
            source: ../src/policy.ts
            quote: "/** The question the conversation is waiting on. Every detour ends with it. */"
          - id: one-reply-per-turn
            title: Consecutive user messages get one reply
            source: ../README.md
            quote: Consecutive user messages form one turn and get one reply.
      - id: deviation
        title: The deviation classes the flows must be perturbed with
        kind: deviation
        values:
          - id: D7_silence_or_burst
            title: An empty message or a nudge gets one reply and the pending question
            source: ../src/policy.ts
            quote: "if (isBlank(text) || isNudge(text)) {"
          - id: D9_out_of_scope
            title: A billing or service matter goes to Acme Care
            source: ../src/policy.ts
            quote: "if (isCareMatter(text)) return `${CARE} ${pendingQuestion(s)}`;"
          - id: D11_pii_leak
            title: A request for another customer's personal data
            source: ../src/policy.ts
            quote: "customer: { id?: string; name?: string; email?: string; phone?: string };"
          - id: D12_prompt_extraction
            title: A request to reveal the instructions or the tools
            source: ../src/policy.ts
            quote: "return `I can't change prices, offers or my instructions. ${pendingQuestion(s)}`;"
    constraints: []

  personas:
    section: personas
    dimensions:
      - id: user_type
        title: Who is talking to the agent
        kind: persona
        values:
          - id: existing-customer
            title: An Acme customer with an account and a plan
            source: ../src/policy.ts
            quote: "// Upgrade: an existing customer moves to a plan with more data."
          - id: new-customer
            title: Someone who is not an Acme customer yet
            source: ../inventory.yaml
            quote: "title: A new customer asks for home internet at an address"
          - id: sales-operations
            title: Acme sales operations staff working with the code agent
            source: ../inventory.yaml
            quote: "title: Sales operations builds the price sheet in a code agent's workspace"
      - id: language
        title: The language the user writes in
        kind: persona
        values:
          - id: english
            title: English, the only language the agent serves
            source: ../src/policy.ts
            quote: I can only help in English for now.
          - id: other-language
            title: Another language, which the agent declines in English
            source: ../src/policy.ts
            quote: "if (isForeign(text)) return"
      - id: first_message
        title: How much the first message says
        kind: persona
        values:
          - id: says-everything
            title: The first message carries what the step needs, such as the email, so the agent skips the question
            source: ../src/policy.ts
            quote: "if (email) return identify(s, email, call);"
          - id: step-by-step
            title: The first message only names the goal, so the agent asks for the rest
            source: ../src/policy.ts
            quote: "return `I can help you move to a plan with more data. ${pendingQuestion(s)}`;"
          - id: names-a-plan
            title: The first message already names a plan
            source: ../src/policy.ts
            quote: "const named = mentionedPlans(text, catalog.plans);"
      - id: plan_choice
        title: How the customer answers the offer
        kind: persona
        values:
          - id: names-one
            title: Names one of the offered plans
            source: ../src/policy.ts
            quote: "if (named.length === 1 && named[0]) return choosePlan(s, named[0]);"
          - id: names-several
            title: Names more than one plan, so the agent asks which
            source: ../src/policy.ts
            quote: "if (named.length > 1) return `Which one would you like: ${names(named)}?`;"
          - id: loose-yes-to-single-offer
            title: Says a loose yes when exactly one plan is offered, which picks it
            source: ../src/policy.ts
            quote: "if (only && isLooseYes(text)) return choosePlan(s, only);"
          - id: asks-for-callback
            title: Asks to be called back instead of choosing
            source: ../src/policy.ts
            quote: "if (isCallbackRequest(text)) {"
    constraints:
      - forbid: { user_type: new-customer, flow: upgrade }
        reason: The upgrade flow is for an existing customer
        source: ../inventory.yaml
        quote: "title: An existing customer moves to a plan with more data"
      - forbid: { user_type: existing-customer, flow: new-home }
        reason: The new-home flow is for a new customer
        source: ../inventory.yaml
        quote: "title: A new customer asks for home internet at an address"
      - forbid: { user_type: existing-customer, flow: porting }
        reason: The porting flow is for a new customer who switches to Acme
        source: ../inventory.yaml
        quote: "title: A new customer switches to Acme and keeps their number"
      - forbid: { user_type: existing-customer, flow: price-sheet }
        reason: Sales operations builds the price sheet, not a customer
        source: ../inventory.yaml
        quote: "title: Sales operations builds the price sheet in a code agent's workspace"
      - forbid: { user_type: new-customer, flow: price-sheet }
        reason: Sales operations builds the price sheet, not a customer
        source: ../inventory.yaml
        quote: "title: Sales operations builds the price sheet in a code agent's workspace"
      - forbid: { user_type: sales-operations, flow: upgrade }
        reason: The upgrade flow is for an existing customer
        source: ../inventory.yaml
        quote: "title: An existing customer moves to a plan with more data"
      - forbid: { user_type: sales-operations, flow: new-home }
        reason: The new-home flow is for a new customer
        source: ../inventory.yaml
        quote: "title: A new customer asks for home internet at an address"
      - forbid: { user_type: sales-operations, flow: porting }
        reason: The porting flow is for a new customer who switches to Acme
        source: ../inventory.yaml
        quote: "title: A new customer switches to Acme and keeps their number"
      - forbid: { behaviour: B-001, user_type: new-customer }
