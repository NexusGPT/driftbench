      - { dimension: first_message, value: names-a-plan, text: "Is the 300 Mbps fiber plan available at 14 Harbor Road, Acmeville?", lang: en }
      - { dimension: plan_choice, value: names-several, text: The 300 Mbps one or the 5G one?, lang: en }
      - { dimension: plan_choice, value: asks-for-callback, text: Can someone just call me back?, lang: en }
      # The turns of each stage transition. {slot} takes a value the cell binds (see the binds relations);
      # when says where a phrase fits; binds states what the phrase itself names, such as a plan.
      - { dimension: stage_transition, value: needs-to-identify, text: "Hi, I already have an Acme plan and I need more data.", lang: en, when: { flow: [upgrade] } }
      - { dimension: stage_transition, value: needs-to-identify, text: "I keep running out of data, can I get a bigger plan?", lang: en, when: { flow: [upgrade] } }
      - { dimension: stage_transition, value: identify-to-offer, text: "It's {email}.", lang: en }
      - { dimension: stage_transition, value: identify-to-identify, text: "It's {email}.", lang: en }
      - { dimension: stage_transition, value: identify-to-closing, text: "It's {email}.", lang: en }
      - { dimension: stage_transition, value: needs-to-address, text: "Hello, I'm looking for home internet.", lang: en, when: { flow: [new-home, order] } }
      - { dimension: stage_transition, value: needs-to-address, text: "Do you have home internet where I live?", lang: en, when: { flow: [new-home, order] } }
      - { dimension: stage_transition, value: address-to-offer, text: "The address is {address}.", lang: en }
      - { dimension: stage_transition, value: address-to-callback, text: "The address is {address}.", lang: en }
      - { dimension: stage_transition, value: address-to-address, text: "The address is {address}.", lang: en }
      - { dimension: stage_transition, value: needs-to-port_number, text: "I'd like to move to Acme and keep my phone number.", lang: en, when: { flow: [porting] } }
      - { dimension: stage_transition, value: port_number-to-offer, text: "My number is {number}.", lang: en }
