        quote: "const price = `for $${plan.monthly_usd} a month`;"
      - kind: states
        subject: { dimension: flow, value: upgrade }
        stage: identify
        to: offer
        when: { account_lookup: [found] }
        must:
          - 'Acme Mobile S, 10 GB for \$15 a month'
          - 'Acme Mobile M, 40 GB for \$25 a month'
