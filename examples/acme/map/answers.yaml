      - { dimension: deviation, value: D3_contradiction, text: "Sorry, my email is ana.ruiz@example.com, not the one I gave before.", lang: en, when: { stage: [identify] } }
      - { dimension: deviation, value: D4_loose_confirmation, text: yeah sounds good, lang: en, when: { stage: [recap] } }
