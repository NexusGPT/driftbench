      - { dimension: stage_transition, value: offer-to-details, text: "I'll take Acme Fiber 1000.", lang: en, when: { flow: [new-home, order], coverage_result: [fiber], plan_choice: [names-one] }, binds: { plan_id: fiber-1000, plan: Acme Fiber 1000 } }
      - { dimension: stage_transition, value: offer-to-details, text: "I'll take Acme Air 5G.", lang: en, when: { flow: [new-home, order], coverage_result: [5g-only], plan_choice: [names-one] }, binds: { plan_id: air-5g, plan: Acme Air 5G } }
      - { dimension: stage_transition, value: offer-to-details, text: "Yes, that one.", lang: en, when: { flow: [new-home, order], coverage_result: [5g-only], plan_choice: [loose-yes-to-single-offer] }, binds: { plan_id: air-5g, plan: Acme Air 5G } }
      - { dimension: stage_transition, value: offer-to-details, text: "Acme Mobile M, please.", lang: en, when: { flow: [porting], plan_choice: [names-one] }, binds: { plan_id: mobile-m, plan: Acme Mobile M } }
      - { dimension: stage_transition, value: offer-to-callback, text: "Can someone just call me back?", lang: en, when: { plan_choice: [asks-for-callback] } }
      - { dimension: stage_transition, value: details-to-recap, text: "{name}, {email}", lang: en, when: { customer_details: [name-and-email] } }
      - { dimension: stage_transition, value: details-to-recap, text: "I'm {name} and my email is {email}.", lang: en, when: { customer_details: [name-and-email] } }
      - { dimension: stage_transition, value: recap-to-order_placed, text: CONFIRM, lang: en }
      - { dimension: stage_transition, value: recap-to-order_placed, text: Confirm, lang: en }
      - { dimension: stage_transition, value: callback-to-handover, text: "You can reach me on {phone}.", lang: en, when: { callback_phone: [given] } }
      - { dimension: stage_transition, value: order_placed-to-closing, text: "No, that's all. Thanks!", lang: en }
      - { dimension: stage_transition, value: handover-to-closing, text: "Great, thank you. Bye!", lang: en }
      # Deviation probes said at a stage, where the class needs one: a plan named again at the recap (D2), two
      # plans at once at the offer (D3).
      - { dimension: deviation, value: D2_goal_shift, text: "Actually, make it Acme Mobile M instead.", lang: en, when: { flow: [upgrade], stage: [recap] }, binds: { plan_id: mobile-m, plan: Acme Mobile M } }
      - { dimension: deviation, value: D2_goal_shift, text: "Actually, make it Acme Mobile L instead.", lang: en, when: { flow: [porting], stage: [recap] }, binds: { plan_id: mobile-l, plan: Acme Mobile L } }
      - { dimension: deviation, value: D2_goal_shift, text: "Actually, make it Acme Fiber 300 instead.", lang: en, when: { flow: [new-home, order], coverage_result: [fiber], stage: [recap] }, binds: { plan_id: fiber-300, plan: Acme Fiber 300 } }
      - { dimension: deviation, value: D3_contradiction, text: "Acme Mobile M. No, wait: Acme Mobile L.", lang: en, when: { flow: [upgrade, porting], stage: [offer] } }
      - { dimension: deviation, value: D3_contradiction, text: "Acme Fiber 300. No, wait: Acme Fiber 1000.", lang: en, when: { flow: [new-home, order], coverage_result: [fiber], stage: [offer] } }

