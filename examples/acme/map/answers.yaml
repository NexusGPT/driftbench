        quote: "five_g: { type: boolean, description: Only when found is true. }"
      - forbid: { port.check.out.eligible: port.check.out.eligible.true, port.check.out.reason: port.check.out.reason.present }
        reason: A reason comes back only when the number cannot move
        source: tools.yaml
        quote: "reason: { type: string, description: Why the number cannot move, when it cannot. }"
      - forbid: { port.check.out.eligible: port.check.out.eligible.false, port.check.out.reason: port.check.out.reason.absent }
        reason: A number that cannot move comes back with its reason
        source: tools.yaml
        quote: "reason: { type: string, description: Why the number cannot move, when it cannot. }"
      - forbid: { order.create.in.type: order.create.in.type.upgrade, order.create.in.customer: order.create.in.customer.present }
        reason: An upgrade takes customer_id only
        source: tools.yaml
