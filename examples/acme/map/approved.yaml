          quote: It reads facts only from tool results and from the customer.
        approved: true
      - id: retry-read-only-once
        title: A read-only tool gets one retry; a side-effecting tool none
        evidence:
          source: ../src/policy.ts
          quote: /** Read-only tools get one retry; side-effecting tools never do. */
        approved: true
      - id: order-never-retried
        title: A failed order is never retried; it goes to sales
        evidence:
          source: ../src/policy.ts
          quote: "// Never retried: a second order.create could place the order twice. Sales takes it from here."
        approved: true
      - id: lead-sent-once
        title: A lead goes to sales once, never retried
        evidence:
          source: ../src/policy.ts
          quote: /** Sends the lead once, never retried. Returns the ticket id, or undefined when sales could not take it. */
        approved: true
      - id: unreadable-is-failure
        title: A tool answer the agent cannot read counts as a failure; it never guesses
        evidence:
          source: ../src/policy.ts
          quote: "// Reading tool results. An answer the agent cannot read counts as a failure: it never guesses."
        approved: true
      - id: refuses-instructions
