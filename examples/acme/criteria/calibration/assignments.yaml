# Written by driftbench judge calibrate. A criterion is owned by the cheapest judge that separates its
# fixture pair in every repeat and reaches kappa 0.8 against the hand labels, in a class with three
# such judges. An unassigned criterion is judged but never gates.
version: 1
mode: hybrid
repeats: 3
kappa_min: 0.8
criteria:
  - criterion: care_redirect
    status: assigned
    owner: jev-a
    class: system1
    judges:
      - jev-a
      - jev-b
      - openai-decisions
    rejudge:
      - google-chat
      - openai-chat
      - anthropic-chat
    separation: 3 of 3
    kappa: 1
  - criterion: checks_before_promising
    status: assigned
    owner: jev-a
    class: system1
    judges:
