name: red then
# Temporary probe. Removed before merge.
on:
  pull_request:
    paths:
      - .github/workflows/red-then.yml
permissions:
  contents: read
jobs:
  red:
    name: red then
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          check-latest: true
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec vitest run packages/generate/test/estate/then.test.ts --maxWorkers=1
      - run: pnpm typecheck
