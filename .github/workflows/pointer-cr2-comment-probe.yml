name: pointer-cr2-comment-probe
on:
  push:
    branches: ['train/pointer-cpi-*']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Biome
        run: pnpm exec biome check --diagnostic-level=error --max-diagnostics=200 packages/validators/src/ladders/pointer/bank packages/validators/test/pointer
      - name: Typecheck
        run: pnpm run typecheck
      - name: Tests
        run: pnpm exec vitest run packages/validators/test/pointer/cr2-comment-privacy.test.ts packages/validators/test/pointer/provenance.test.ts packages/validators/test/pointer/bank.test.ts packages/validators/test/pointer/reference.test.ts packages/validators/test/pointer/hardening.test.ts packages/validators/test/pointer/cause-count.test.ts
  bank:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Bank on the real reader
        shell: bash
        run: |
          pnpm -s driftbench validate pointer --seeds 1..1 --all-levels --items --json > items.json
          node -e "
          const j=JSON.parse(require('fs').readFileSync('items.json','utf8'));
          const all=JSON.stringify(j);
          console.log('size',all.length);
          const find=(o,out=[])=>{if(Array.isArray(o))o.forEach(x=>find(x,out));else if(o&&typeof o==='object'){if(typeof o.id==='string'&&o.id.startsWith('privacy.comment-text-never-leaves'))out.push(o);Object.values(o).forEach(x=>find(x,out));}return out;};
          for(const it of find(j))console.log(JSON.stringify(it));
          "
      - uses: actions/upload-artifact@v4
        with:
          name: items
          path: items.json
