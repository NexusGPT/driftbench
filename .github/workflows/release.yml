name: release

# Runs only when a version tag such as v0.1.0 is pushed. Every job also checks the ref, so a manual
# re-run on a branch publishes nothing. npm uses the NPM_TOKEN secret with provenance; PyPI uses
# trusted publishing (no token), configured on PyPI for this repository, this workflow and the
# `pypi` environment. PyPI stays off unless the repository variable PUBLISH_PYPI is set to true.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: build, test and check the release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --maxWorkers=2
      - run: pnpm build
      - name: Release check (versions equal the tag, changelog, clean packs)
        run: node tools/release/check.mjs --expect "${GITHUB_REF_NAME}"
      - name: Find the Python package
        id: python
        run: |
          if [ -f python/driftbench/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v6
        if: steps.python.outputs.present == 'true'
        with:
          python-version: '3.12'
      - name: Python tests
        if: steps.python.outputs.present == 'true'
        working-directory: python/driftbench
        run: |
          python -m pip install pytest
          python -m pytest
    outputs:
      python: ${{ steps.python.outputs.present }}

  npm:
    name: publish to npm
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Put the license in every package
        run: for dir in packages/*/; do cp LICENSE NOTICE THIRD_PARTY_LICENSES.md "$dir"; done
      # pnpm publish rewrites workspace:* to the release version and hands each tarball to npm, which
      # signs the provenance statement. Private packages are skipped.
      - name: Publish
        run: pnpm -r --filter "./packages/**" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

  pypi:
    name: publish to PyPI
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && needs.verify.outputs.python == 'true' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the sdist and the wheel
        run: |
          python -m pip install build
          python -m build python/driftbench --outdir python/driftbench/dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/driftbench/dist
