name: cache warm

# Seeds the caches a pull request reads. GitHub scopes a cache to the ref that saved it: a pull request run reads the
# caches of its own merge ref and of its base branch, never another pull request's. `pr fast` saves on its merge ref
# only, so without this job the first run of every pull request found no build cache and rebuilt every package. On
# each push to a base branch this job saves the pnpm store keyed by the lockfile and the package build keyed by its
# sources, under the same keys as `pr fast` and `pr affected shard` in ci.yml. A pull request that changes no package
# source then restores the build, and one that changes the lockfile restores the newest store and downloads only its
# delta. Keep the two keys identical to ci.yml.
on:
  push:
    branches: [main, release/next]
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces an older warm-up of the same branch: only the newest head's caches are worth saving.
concurrency:
  group: cache-warm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    name: warm the caches
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      # The build reads no history, so one commit is enough. A stalled fetch is cut after 3 minutes and tried once more,
      # as in every job of ci.yml.
      - uses: actions/checkout@v7
        id: checkout
        timeout-minutes: 3
        continue-on-error: true
        with:
          fetch-depth: 1
      - uses: actions/checkout@v7
        if: steps.checkout.outcome != 'success'
        timeout-minutes: 10
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
      - name: Locate the pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: node-cache-${{ runner.os }}-x64-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            node-cache-${{ runner.os }}-x64-pnpm-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Cache package builds
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            examples/*/dist
            .cache/api-surface-build.json
          key: build-v1-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'tsconfig*.json', 'packages/**/src/**', 'packages/**/package.json', 'packages/**/tsconfig*.json', 'packages/**/tsup.config.*', 'examples/**/src/**', 'examples/**/package.json', 'examples/**/tsconfig*.json', 'tools/structure/**') }}
      # Builds only when the restored stamp is missing or stale, exactly as `pr fast` does.
      - run: node tools/structure/api-surface.mjs --build --check
