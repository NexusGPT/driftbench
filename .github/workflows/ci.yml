name: ci
on:
  pull_request:
jobs:
  salt-probe:
    name: salt probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          check-latest: true
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run build
      - name: store meta tests
        run: pnpm --dir packages/store exec vitest run test/meta.test.ts test/file.test.ts
      - name: estate salt tests
        if: always()
        run: pnpm --dir packages/cli exec vitest run test/estate-live.test.ts -t "a variable the run passes on"
