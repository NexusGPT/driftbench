name: needs count probe
on:
  workflow_dispatch:
    inputs:
      jobs:
        required: true
        type: string
permissions:
  contents: read
jobs:
  needs-counts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec biome check --write tools/docs/estate-needs.test.ts
      - if: always()
        run: pnpm exec vitest run tools/docs/estate-needs.test.ts --maxWorkers=2
      - if: always()
        run: git diff -- tools/docs/estate-needs.test.ts > /tmp/needs-format.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: needs-format
          path: /tmp/needs-format.patch
