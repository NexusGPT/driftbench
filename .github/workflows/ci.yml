name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: benchmark replay and floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/bench-lint.mjs
      - run: pnpm driftbench bench replay --slice all --check-floor

  build:
    # Draft pull requests do not use runners; marking one ready starts its checks.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --maxWorkers=2
      - run: pnpm build
      - run: pnpm docs:reference --check
      - run: pnpm docs:links
      - run: pnpm docs:site:build
      - name: CLI smoke
        run: node packages/cli/dist/bin.js --version

  python:
    # Draft pull requests do not use runners; marking one ready starts its checks.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The tests run the driftbench CLI from source, through tsx.
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest
        working-directory: python/driftbench

  viewer-journey:
    # Draft pull requests do not use runners; marking one ready starts its checks.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: viewer journey (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and its system libraries
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Drive the viewer at 1280 and 390 px
        run: pnpm exec tsx tools/browser/viewer-journey.ts --out viewer-journey
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-journey
          path: viewer-journey
          if-no-files-found: ignore

  guard:
    # Draft pull requests do not use runners; marking one ready starts its checks.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: leak guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Canary (proves every check fires)
        env:
          GUARD_DENYLIST: ${{ secrets.GUARD_DENYLIST }}
        run: node tools/guard/guard.mjs --canary ${{ github.event_name == 'push' && '--require-denylist' || '' }}
      - name: Scan the tree
        env:
          GUARD_DENYLIST: ${{ secrets.GUARD_DENYLIST }}
        run: node tools/guard/guard.mjs ${{ github.event_name == 'push' && '--require-denylist' || '' }}
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
