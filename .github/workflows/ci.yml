name: ci
on:
  pull_request:
jobs:
  carry-probe:
    name: carry probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          check-latest: true
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run build
      - run: pnpm --dir packages/cli exec vitest run test/estate-live.test.ts -t "carries a failure as a failure"
