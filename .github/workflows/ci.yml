name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: benchmark replay and floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/bench-lint.mjs
      - run: node --import tsx benchmarks/cli.ts replay --slice all --check-floor

  build:
    # Draft pull requests do not use runners; marking one ready starts its checks.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The API gate builds first and stamps source + emitted bytes. Tests verify that stamp.
      - run: node tools/structure/api-surface.mjs --build --check
      - run: pnpm test --maxWorkers=2
      - run: pnpm docs:reference --check
      - run: pnpm docs:links
      - run: pnpm docs:site:build
      - name: CLI smoke
        run: node packages/cli/dist/bin.js --version

  python:
    # Draft pull requests do not use runners; marking one ready starts its checks.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The tests run the driftbench CLI from source, through tsx.
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest
        working-directory: python/driftbench

  comparison-replay:
    name: offline comparison replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reproduce published results without model calls or file rewrites
        run: python -m unittest discover -s comparisons -p test_reproducibility.py -v

  viewer-journey:
    # Draft pull requests do not use runners; marking one ready starts its checks.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: viewer journey (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and its system libraries
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Drive the viewer at 1280 and 390 px
        run: pnpm exec tsx tools/browser/viewer-journey.ts --out viewer-journey
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-journey
          path: viewer-journey
          if-no-files-found: ignore

  guard:
    # Draft pull requests do not use runners; marking one ready starts its checks.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: leak guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Canary (proves every check fires)
        env:
          GUARD_DENYLIST: ${{ secrets.GUARD_DENYLIST }}
        run: node tools/guard/guard.mjs --canary ${{ github.event_name == 'push' && '--require-denylist' || '' }}
      - name: Scan the tree
        env:
          GUARD_DENYLIST: ${{ secrets.GUARD_DENYLIST }}
        run: node tools/guard/guard.mjs ${{ github.event_name == 'push' && '--require-denylist' || '' }}
      - name: Secret scan
        # The gitleaks binary runs directly, so the job makes no GitHub API call. The old action looked up the
        # user through the API and failed the job when the installation quota was spent. The range matches the
        # action's: on a pull request, the pull request's own commits; on a push, the pushed commits.
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dir="$(mktemp -d)"
          curl -sSfL -o "$dir/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $dir/$archive" | sha256sum -c -
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="--no-merges --first-parent ${PR_BASE}..${PR_HEAD}"
          else
            first="$(jq -r '.commits[0].id // empty' "$GITHUB_EVENT_PATH")"
            last="$(jq -r '.commits[-1].id // empty' "$GITHUB_EVENT_PATH")"
            if [ -z "$first" ]; then
              echo "No commits to scan"
              exit 0
            elif [ "$first" = "$last" ]; then
              range="-1 ${last}"
            else
              range="--no-merges --first-parent ${first}^..${last}"
            fi
          fi
          "$dir/gitleaks" detect --redact -v --exit-code=2 --config .gitleaks.toml --log-opts="$range"
