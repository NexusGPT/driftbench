name: fmt
# Temporary probe. Removed before merge.
on:
  pull_request:
    paths:
      - .github/workflows/fmt.yml
permissions:
  contents: read
jobs:
  fmt:
    name: fmt
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          check-latest: true
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec biome check --write packages/generate/src/estate/then.ts packages/generate/test/estate/then.test.ts || true
      - run: git diff > fmt.patch; cat fmt.patch; git diff --stat
      - run: pnpm exec biome check --diagnostic-level=error --max-diagnostics=1000 packages/generate | tail -30 || true
