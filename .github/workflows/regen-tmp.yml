name: regen tmp
# Temporary: regenerates committed outputs and uploads them. Removed before merge.
on:
  pull_request:
    paths:
      - .github/workflows/regen-tmp.yml
permissions:
  contents: read
jobs:
  regen:
    name: regen tmp
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          check-latest: true
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec vitest run packages/validators/test/estate/zz-regen.test.ts --maxWorkers=1
      - run: |
          rm -rf examples/estates/fixture/generated && cp -R regen-out examples/estates/fixture/generated && rm -rf regen-out
      - run: pnpm docs:reference
      - run: pnpm exec biome check --write packages/generate/src/estate/inputs.ts packages/validators/test/estate/fake-provokes.test.ts examples/estates/fixture/live/fake || true
      - run: pnpm exec biome check --diagnostic-level=error packages/generate/src packages/validators/test/estate/fake-provokes.test.ts examples/estates/fixture/live || true
      - run: |
          git status --porcelain
          git ls-files -m -o --exclude-standard | grep -v '^packages/validators/test/estate/zz-regen' | grep -v '^.github' | tar -czf regen.tgz -T -
          ls -la regen.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: regen
          path: regen.tgz
