name: pointer-cr2-links-probe
on:
  push:
    branches: ['train/pointer-cr2-links-*']
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Biome
        run: >-
          pnpm exec biome check --diagnostic-level=error --max-diagnostics=200
          packages/validators/src/ladders/pointer/blind/bank/relations.ts
          packages/validators/test/pointer/cr2-links.test.ts
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        file: [cr2-links, blind-binding, cause-count]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Test
        run: pnpm exec vitest run packages/validators/test/pointer/${{ matrix.file }}.test.ts
