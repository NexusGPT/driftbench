name: regen 1319
# Temporary: runs the documented "Regenerate the fixture" block of docs/estate.md and the reader-cases commands, restores the
# scan times, and uploads what changed. Removed with the branch.
on:
  pull_request:
    paths:
      - .github/workflows/regen-1319.yml
permissions:
  contents: read
jobs:
  regen:
    name: regen 1319
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          check-latest: true
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Regenerate the fixture (docs/estate.md of #1226, steps 1 to 7, verbatim apart from the exit echo)
        run: |
          F=examples/estates/fixture
          V=examples/estates/fixture-v2
          P=packages/generate/test/estate/fixtures
          T=$(mktemp -d)

          # 1. The map: a pointer scan that replays the committed cassette. The scan updates a copy of the ledger.
          cp $F/ledger.json $T/ledger.json
          pnpm -s driftbench estate scan $F --runtime claude-code --pointer --cassette $F/cassette.jsonl --ledger $T/ledger.json --update --out $F/map.yaml --force || echo "exit $? : pnpm -s driftbench estate scan $F --runt"

          # 2. The approved map, and the space map of the docs.
          cp $F/map.yaml $F/approved.yaml
          pnpm -s driftbench estate approve $F/approved.yaml --all || echo "exit $? : pnpm -s driftbench estate approve $F/app"
          pnpm -s driftbench estate map $F/approved.yaml --to $F/space.yaml --agent northwind || echo "exit $? : pnpm -s driftbench estate map $F/approve"

          # 3. The map hash, in the three files that pin it.
          HASH=$(grep -m1 '^hash:' $F/approved.yaml | cut -d' ' -f2)
          perl -pi -e "s/^mapHash: \S+/mapHash: $HASH/" $F/phrases.yaml $P/plan.yaml
          perl -pi -e "s/MAP_HASH = '[0-9a-f]+'/MAP_HASH = '$HASH'/" packages/adapters/test/claude-code/live/support.ts

          # 4. The plan, of the full declared space.
          pnpm -s driftbench estate map $F/approved.yaml --to $T/space.yaml --agent estate || echo "exit $? : pnpm -s driftbench estate map $F/approve"
          pnpm -s driftbench estate plan $F/approved.yaml --out $F/plan.yaml --space $T/space.yaml --force || echo "exit $? : pnpm -s driftbench estate plan $F/approv"

          # 5. The approved copy of the plan, under the three note lines it already has.
          head -3 $P/planner-plan.approved.yaml > $T/notes.txt
          pnpm -s driftbench estate plan approve $F/plan.yaml --all --out $T/approved-plan.yaml || echo "exit $? : pnpm -s driftbench estate plan approve $"
          cat $T/notes.txt $T/approved-plan.yaml > $P/planner-plan.approved.yaml

          # 6. The suite.
          pnpm -s driftbench estate generate --map $F/approved.yaml --plan $P/planner-plan.approved.yaml --out $F/generated --force || echo "exit $? : pnpm -s driftbench estate generate --map"

          # 7. Fixture-v2: its map, the diff against the fixture, the impact on its tests.
          cp $F/ledger.json $V/ledger.json
          pnpm -s driftbench estate scan $V --runtime claude-code --pointer --cassette $V/cassette.jsonl --ledger $V/ledger.json --update --out $V/map.yaml --force || echo "exit $? : pnpm -s driftbench estate scan $V --runt"
          pnpm -s driftbench estate diff $F/approved.yaml $V/map.yaml --old-guards $V/maintain/guard-state.v1.yaml --old-ledger $F/ledger.json --new-ledger $V/ledger.json --out $V/maintain/diff.json > $V/maintain/diff.txt || echo "exit $? : pnpm -s driftbench estate diff $F/approv"
          pnpm -s driftbench estate impact $V/maintain/diff.json --tests $V/tests > $V/maintain/impact.txt || echo "exit $? : pnpm -s driftbench estate impact $V/main"
          pnpm -s driftbench estate impact $V/maintain/diff.json --tests $V/tests --out $V/maintain/impact.json || echo "exit $? : pnpm -s driftbench estate impact $V/main"
          pnpm exec biome format --write $V/maintain/diff.json $V/maintain/impact.json
          rm -rf "$T"

      - name: Reader-cases (examples/estates/reader-cases/README.md)
        run: |
          pnpm -s driftbench estate scan examples/estates/reader-cases --runtime claude-code --pointer --cassette examples/estates/reader-cases/cassette.jsonl --out examples/estates/reader-cases/map.yaml --force || echo "exit $?"
          pnpm -s driftbench estate approve examples/estates/reader-cases/map.yaml --all --to examples/estates/reader-cases/approved.yaml || echo "exit $?"
      - name: Keep the committed times (docs/estate.md, regenerate the fixture)
        run: |
          python3 - <<'PY'
          import subprocess,re
          files=subprocess.run(['git','diff','--name-only'],capture_output=True,text=True).stdout.split()
          for f in files:
              old=subprocess.run(['git','show','origin/release/next:'+f],capture_output=True,text=True).stdout.split('\n')
              new=open(f).read().split('\n')
              def first(lines,pat):
                  for l in lines:
                      if re.match(pat,l): return l
              for pat in (r'^readAt: ',r'^  at: \d{4}-',r'^    "readAt": ',r'^      "readAt": ',r'^    "?at"?: ?"?\d{4}-'):
                  olds=[l for l in old if re.match(pat,l)]
                  idx=[i for i,l in enumerate(new) if re.match(pat,l)]
                  if len(olds)==len(idx):
                      for i,o in zip(idx,olds): new[i]=o
              open(f,'w').write('\n'.join(new))
          PY
      - name: What changed
        run: |
          git status --short > changed.txt
          git diff --stat > stat.txt
          cat changed.txt | head -80; tail -3 stat.txt
          git ls-files -m -o --exclude-standard | grep -v '^.github' | tar -czf regen.tgz -T -
      - uses: actions/upload-artifact@v4
        with:
          name: regen
          path: |
            regen.tgz
            changed.txt
            stat.txt
