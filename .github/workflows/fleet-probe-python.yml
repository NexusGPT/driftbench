name: fleet probe python (hetzner-driftbench)

# PROBE ONLY. Never merged: the PR carrying it is closed once its runs have been read.
# The judged arm is the scrubbed-environment one: python/driftbench/tests/test_agent.py starts
# sys.executable with only PATH and three DRIFTBENCH_* variables, so LD_LIBRARY_PATH is gone and the
# interpreter must find libpython through its own embedded path.
on:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: setup-python ${{ matrix.python }} (on hetzner-driftbench)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: hetzner-driftbench
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: Which runner, which tool cache
        run: |
          echo "runner.name=${{ runner.name }}"
          echo "RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE:-<unset>} AGENT_TOOLSDIRECTORY=${AGENT_TOOLSDIRECTORY:-<unset>}"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: With setup-python's environment
        run: python -c 'import sys; print(sys.version)'
      - name: With a scrubbed environment (the test_agent.py case)
        run: env -i PATH="$PATH" "$pythonLocation/bin/python" -c 'import sys; print(sys.executable, sys.version)'

  node-module-load:
    name: module-load.test.mjs on node ${{ matrix.node }} (on hetzner-driftbench)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: hetzner-driftbench
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '24.21.0']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: node --version
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: One measured child, its status and stderr (the test discards stderr on a status failure)
        run: |
          cat > /tmp/one-child.mjs <<'JS'
          import { runNode, writeProbe } from './tools/perf-baseline.mjs';
          import { join } from 'node:path';
          writeProbe();
          const r = runNode(['--import', 'tsx', '--input-type=module', '--eval', 'await import(process.argv[1]);', join(process.cwd(), 'packages/artifacts/src/index.ts')], { probe: 'full' });
          console.log('status', r.status, 'report', r.report ? 'present' : 'absent');
          console.log('stderr<<<' + r.stderr + '>>>');
          JS
          cp /tmp/one-child.mjs ./one-child.mjs && node ./one-child.mjs
      - run: pnpm exec vitest run tools/perf/module-load.test.mjs
