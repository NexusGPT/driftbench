name: northwind regressions
on:
  push:
    branches: ['train/sol-lane-northwind-*']
    paths:
      - '.github/workflows/northwind-regressions.yml'
      - 'packages/**/test/*northwind*.test.ts'
      - 'packages/adapters/test/claude-code/live/fake-failure.test.ts'
      - 'packages/adapters/test/claude-code/live/fake-default.test.ts'
      - 'examples/northwind-campaign/rehearsal/**'
      - 'packages/users/src/simulated.ts'
  workflow_dispatch:
    inputs:
      jobs:
        required: true
        type: string
        description: 'regressions: focused Northwind regression tests only'
permissions:
  contents: read
jobs:
  regressions:
    if: startsWith(github.ref, 'refs/heads/train/') && (github.event_name == 'push' || inputs.jobs == 'regressions')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec vitest run packages/cli/test/northwind-workflow.test.ts packages/users/test/northwind-recording.test.ts packages/adapters/test/claude-code/live/fake-failure.test.ts packages/adapters/test/claude-code/live/fake-default.test.ts packages/cli/test/northwind-contracts.test.ts --maxWorkers=2
      - name: Format lane files on GitHub
        if: always()
        run: |
          pnpm exec biome check --write packages/adapters/test/claude-code/live/fake-default.test.ts examples/northwind-campaign/evidence/live-mac-2026-10-21.json packages/cli/test/northwind-contracts.test.ts examples/northwind-campaign/rehearsal/manifest.json packages/cli/test/northwind-workflow.test.ts packages/users/test/northwind-recording.test.ts packages/adapters/test/claude-code/live/fake-failure.test.ts packages/users/src/simulated.ts examples/northwind-campaign/plugin.mjs examples/northwind-campaign/rehearsal/claude.mjs
          git diff > /tmp/northwind-format.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: northwind-format
          path: /tmp/northwind-format.patch
