name: pr affected after retarget

# `ci.yml` never runs on an `edited` event: a title or body edit would start a second `ci` run on a head that
# already has results, and that run would post skipped `pr affected` and `train gate` check runs beside the real
# ones. This workflow takes the one `edited` case that matters: a change of base. `pr affected` compares with the
# PR's own base branch, so when the base changes the affected tests change; this job reports them again, with the
# same steps as `pr affected` in `ci.yml`. Its check name differs from `pr affected` on purpose: a title edit
# posts a skipped run of this job, and that run must not carry a name the merge train or a reader looks up.
on:
  pull_request:
    types: [edited]

permissions:
  contents: read

# One run per edit, none cancelled: a later title edit must not cancel a retarget run in flight.
concurrency:
  group: pr-affected-retarget-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  pr-affected-retarget:
    name: pr affected (retarget)
    # Only a base change, on a non-draft PR that is neither a train PR nor a release PR.
    if: github.event.changes.base != null && !github.event.pull_request.draft && !startsWith(github.head_ref, 'train/') && !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DRIFTBENCH_TIMING_TESTS: skip
    steps:
      # A stalled repository fetch is cut after 3 minutes and tried once more, so it cannot hold the job for its timeout.
      - uses: actions/checkout@v7
        id: checkout
        timeout-minutes: 3
        continue-on-error: true
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        if: steps.checkout.outcome != 'success'
        timeout-minutes: 10
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          check-latest: true
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Cache package builds
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            examples/*/dist
            .cache/api-surface-build.json
          key: build-v1-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'tsconfig*.json', 'packages/**/src/**', 'packages/**/package.json', 'packages/**/tsconfig*.json', 'packages/**/tsup.config.*', 'examples/**/src/**', 'examples/**/package.json', 'examples/**/tsconfig*.json', 'tools/structure/**') }}
      # The tests verify the build stamp, so the build gate runs first.
      - run: node tools/structure/api-surface.mjs --build --check
      # Markdown dependencies are read at runtime, so --changed alone cannot select their examples.
      - name: Help topics and executable examples
        run: pnpm exec vitest run packages/cli/test/help-topics.test.ts --maxWorkers=2
      # The affected tests are the ones changed against the PR's own base branch, so a PR into release/next runs
      # its own delta, never the whole difference between release/next and main (which overran the time limit).
      - name: Fetch the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
      - name: Tests affected by this PR
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm test --maxWorkers=2 --changed "origin/$BASE_REF" --passWithNoTests
