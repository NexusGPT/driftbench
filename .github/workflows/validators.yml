  generator-measure-row:
    # Join all seed shards before counting passEverySeed, then write a schema-validated iteration-0 row.
    needs: generator-measure
    if: needs.generator-measure.result == 'success'
    name: generator measurement journal row
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A stalled repository fetch is cut after 3 minutes and tried once more, so it cannot hold the job for its timeout.
      - uses: actions/checkout@v7
        id: checkout
        timeout-minutes: 3
        continue-on-error: true
      - uses: actions/checkout@v7
        if: steps.checkout.outcome != 'success'
        timeout-minutes: 10
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          check-latest: true
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@v4
        with:
          pattern: generator-items-*
          path: generator-reports
          merge-multiple: true
      - name: Join the reports and record iteration 0
        shell: bash
        env:
          JOBS: ${{ inputs.jobs }}
        run: |
          seeds=1..3
          hidden=--hidden
          if [[ ",$JOBS," == *,generator-measure-full,* ]]; then
            seeds=1..20
          elif [[ ",$JOBS," == *,generator-measure-one,* ]]; then
            seeds=1..1
            hidden=
          fi
          mkdir -p generator-measurement
          status=0
          pnpm -s driftbench validate generator --reports generator-reports --seeds "$seeds" $hidden --items --all-levels --json > generator-measurement/generator-items.json || status=$?
          test "$status" -lt 64
          pnpm -s exec tsx validators/generator/baseline.ts --report generator-measurement/generator-items.json --executor builder --model 'GitHub Actions (deterministic measurement)' --commit "$GITHUB_SHA" --journal-root "$GITHUB_WORKSPACE/generator-measurement" > generator-measurement/row.json
      - name: Record the pending hardness gate
        shell: bash
        run: |
          cp validators/generator/audit.md validators/generator/GATE.md generator-measurement/validators/generator/
          touch generator-measurement/pnpm-workspace.yaml
          status=0
          cd "$GITHUB_WORKSPACE/generator-measurement" && node --import tsx "$GITHUB_WORKSPACE/packages/cli/src/bin.ts" validate generator --hardness --json > hardness.json || status=$?
          # A baseline is not a pilot; all four independent audits are pending. A usage error is not proof.
          test "$status" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generator-measurement-${{ contains(format(',{0},', inputs.jobs), ',generator-measure-full,') && 'full' || contains(format(',{0},', inputs.jobs), ',generator-measure-one,') && 'one' || 'standard' }}
          path: generator-measurement

  protect:
    name: executor branches leave the validators alone
    if: github.event_name == 'pull_request'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      # A stalled repository fetch is cut after 3 minutes and tried once more, so it cannot hold the job for its timeout.
      - uses: actions/checkout@v7
        id: checkout
        timeout-minutes: 3
        continue-on-error: true
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        if: steps.checkout.outcome != 'success'
        timeout-minutes: 10
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          check-latest: true
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Refuse protected changes from an exec/ branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: pnpm driftbench validate protect --branch "$HEAD_REF" --base "origin/$BASE_REF"

  variables-spans-failing:
    # The span recorder's round (tools/variables-record-spans.mjs). It measures the variables bank with the labels
    # recorded so far for this commit (none on the first round), then runs again each item that failed and writes
    # the condition spans those items read. An item stops at its first span with no label, so one round reaches only
    # that span; the recorder labels it and dispatches this job again, until a round reads no span the recording
    # lacks. The scale items stay out. The job never runs on a push or a pull request.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',variables-spans-failing,')
    name: variables spans of the failing items
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # A stalled repository fetch is cut after 3 minutes and tried once more, so it cannot hold the job for its timeout.
      - uses: actions/checkout@v7
        id: checkout
        timeout-minutes: 3
        continue-on-error: true
      - uses: actions/checkout@v7
        if: steps.checkout.outcome != 'success'
        timeout-minutes: 10
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Fetch the span cassette when one exists
        id: cassette
        shell: bash
        run: |
          git fetch --depth=1 origin cassettes/variables-spans
          if git show "FETCH_HEAD:${GITHUB_SHA}.jsonl" > "$RUNNER_TEMP/spans-cassette.jsonl"; then
            echo "path=$RUNNER_TEMP/spans-cassette.jsonl" >> "$GITHUB_OUTPUT"
          fi
      - name: Measure, then read the spans of the failing items
        shell: bash
        env:
          DRIFTBENCH_VARIABLES_CASSETTE: ${{ steps.cassette.outputs.path }}
        run: |
          status=0
          pnpm -s driftbench validate variables --seeds 1..3 --hidden --items --all-levels --json > variables-items.json || status=$?
          echo "level (exit code) $status"
          test -s variables-items.json
          pnpm exec tsx tools/variables-failing-spans.ts variables-items.json spans-out
      - uses: actions/upload-artifact@v4
        with:
          name: variables-failing-spans
          path: spans-out/spans.jsonl
