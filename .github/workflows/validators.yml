name: validators

# Runs every registered validator on seeds 1 to 3 and the hidden seed, enforces validators/floors.json,
# checks each validator's HANDOVER.md against its journal, and refuses a pull request from an executor
# branch (exec/...) that changes the validator code, the floors, the executor instruction, the fault family,
# the statistics reference fixtures or this file. Documented in docs/validators.md section 8.
#
# The work runs as a wide matrix. One leg is one validator on one seed (the hidden seed has its own leg), and a
# validator whose ladder is long is cut into slices of levels. Each leg uploads its `--json` report. The jobs
# `ladders` and `system-full` join the reports of their legs with `driftbench validate --reports`, which
# rebuilds the run one pass would give and checks the floors on it, and fail when any leg did not succeed.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      jobs:
        description: Comma-separated job ids to run on a train/* branch, no spaces (for example build,python). A dispatch on any other branch runs nothing.
        required: true
        type: string

permissions:
  contents: read

# Pull requests share one group per ref and a newer push cancels the older run of that PR, train PRs included: only
# the latest head of a train can merge. The release PR is never cancelled. A push to main and a dispatch each get a
# group of their own, so no run on main ever cancels or replaces another.
concurrency:
  group: validators-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/') }}

# Runner pool. `vars.RUNNER_LABEL` moves the jobs below onto a self-hosted pool; with it unset every job runs on
# `ubuntu-latest`. A pull request whose head repository is not this repository (a fork) always runs on
# `ubuntu-latest`, because this repository is public and a fork's code must never run on a self-hosted machine.
# A push to main and a dispatch carry no pull request, so they follow the variable.
# Every setup-node step passes `check-latest: true`: a self-hosted image caches an older Node.js 24 (24.9.0) than the
# hosted images carry, and under it the module-load tests of tools/perf exit 1.
jobs:
  ladders-leg:
    # One leg is one validator on one seed, or one slice of levels of a long ladder. `--check-floor` caps a leg at
    # the floor of its validator and exits 1 below it. A validator without a floor walks to its first failing
    # level, as a single run does, so each slice of the generator ladder computes its own levels.
    if: github.event_name == 'push' || startsWith(github.head_ref, 'train/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',ladders,'))
    name: ${{ matrix.name }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: estate-s1
            name: estate seed 1
            component: estate
            flags: --seed 1
          - id: estate-s2
            name: estate seed 2
            component: estate
            flags: --seed 2
          - id: estate-s3
            name: estate seed 3
            component: estate
            flags: --seed 3
          - id: estate-hidden
            name: estate seed hidden
            component: estate
            flags: --hidden --hidden-only
          - id: judges-s1
            name: judges seed 1
            component: judges
            flags: --seed 1
          - id: judges-s2
            name: judges seed 2
            component: judges
            flags: --seed 2
          - id: judges-s3
            name: judges seed 3
            component: judges
            flags: --seed 3
          - id: judges-hidden
            name: judges seed hidden
            component: judges
            flags: --hidden --hidden-only
          - id: map-s1
            name: map seed 1
            component: map
            flags: --seed 1
          - id: map-s2
            name: map seed 2
            component: map
            flags: --seed 2
          - id: map-s3
            name: map seed 3
            component: map
            flags: --seed 3
          - id: map-hidden
            name: map seed hidden
            component: map
            flags: --hidden --hidden-only
          - id: stats-s1
            name: stats seed 1
            component: stats
            flags: --seed 1
          - id: stats-s2
            name: stats seed 2
            component: stats
            flags: --seed 2
          - id: stats-s3
            name: stats seed 3
            component: stats
            flags: --seed 3
          - id: stats-hidden
            name: stats seed hidden
            component: stats
            flags: --hidden --hidden-only
          - id: system-s1
            name: system seed 1
            component: system
            flags: --seed 1
          - id: system-s2
            name: system seed 2
            component: system
            flags: --seed 2
          - id: system-s3
            name: system seed 3
            component: system
            flags: --seed 3
          - id: system-hidden
            name: system seed hidden
            component: system
            flags: --hidden --hidden-only
          - id: variables-s1
            name: variables seed 1
            component: variables
            flags: --seed 1
          - id: variables-s2
            name: variables seed 2
            component: variables
            flags: --seed 2
          - id: variables-s3
            name: variables seed 3
            component: variables
            flags: --seed 3
          - id: variables-hidden
            name: variables seed hidden
            component: variables
            flags: --hidden --hidden-only
          - id: pointer-s1
            name: pointer seed 1
            component: pointer
            flags: --seed 1
          - id: pointer-s2
            name: pointer seed 2
            component: pointer
            flags: --seed 2
          - id: pointer-s3
            name: pointer seed 3
            component: pointer
            flags: --seed 3
          - id: pointer-hidden
            name: pointer seed hidden
            component: pointer
            flags: --hidden --hidden-only
          - id: generator-s1-1-6
            name: generator seed 1 levels 1 to 6
            component: generator
            flags: --seed 1 --levels 1..6
          - id: generator-s1-7-11
            name: generator seed 1 levels 7 to 11
            component: generator
            flags: --seed 1 --levels 7..11
          - id: generator-s1-12-17
            name: generator seed 1 levels 12 to 17
            component: generator
            flags: --seed 1 --levels 12..17
          - id: generator-s1-18-19
            name: generator seed 1 levels 18 to 19
            component: generator
            flags: --seed 1 --levels 18..19
          - id: generator-s2-1-6
            name: generator seed 2 levels 1 to 6
            component: generator
            flags: --seed 2 --levels 1..6
          - id: generator-s2-7-11
            name: generator seed 2 levels 7 to 11
            component: generator
            flags: --seed 2 --levels 7..11
          - id: generator-s2-12-17
            name: generator seed 2 levels 12 to 17
            component: generator
            flags: --seed 2 --levels 12..17
          - id: generator-s2-18-19
            name: generator seed 2 levels 18 to 19
            component: generator
            flags: --seed 2 --levels 18..19
          - id: generator-s3-1-6
            name: generator seed 3 levels 1 to 6
            component: generator
            flags: --seed 3 --levels 1..6
          - id: generator-s3-7-11
            name: generator seed 3 levels 7 to 11
            component: generator
            flags: --seed 3 --levels 7..11
          - id: generator-s3-12-17
            name: generator seed 3 levels 12 to 17
            component: generator
            flags: --seed 3 --levels 12..17
          - id: generator-s3-18-19
            name: generator seed 3 levels 18 to 19
            component: generator
            flags: --seed 3 --levels 18..19
          - id: generator-hidden-1-6
            name: generator seed hidden levels 1 to 6
            component: generator
            flags: --hidden --hidden-only --levels 1..6
          - id: generator-hidden-7-11
            name: generator seed hidden levels 7 to 11
            component: generator
            flags: --hidden --hidden-only --levels 7..11
          - id: generator-hidden-12-17
            name: generator seed hidden levels 12 to 17
            component: generator
            flags: --hidden --hidden-only --levels 12..17
          - id: generator-hidden-18-19
            name: generator seed hidden levels 18 to 19
            component: generator
            flags: --hidden --hidden-only --levels 18..19
    steps:
      # A stalled repository fetch is cut after 3 minutes and tried once more, so it cannot hold the job for its timeout.
      - uses: actions/checkout@v7
        id: checkout
        timeout-minutes: 3
        continue-on-error: true
      - uses: actions/checkout@v7
        if: steps.checkout.outcome != 'success'
        timeout-minutes: 10
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          check-latest: true
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run this leg
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          FLAGS: ${{ matrix.flags }}
          LEG: ${{ matrix.id }}
        run: |
          mkdir -p report
          # --check-floor caps the leg at its floor and exits 1 below it; a validator without a floor walks on.
          pnpm -s driftbench validate "$COMPONENT" $FLAGS --check-floor --json > "report/$LEG.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ladders-${{ matrix.id }}
          path: report
          retention-days: 3

  ladders-tail:
    # Levels 20 to 23 of the generator cost most of an hour in one leg. Each level of each seed is a leg of its own
    # and starts with the rest, not after the slices below it: a single run stops at its first failing level, and
    # the join does the same, keeping only the levels up to the first failing one (a level above it is dropped).
    if: github.event_name == 'push' || startsWith(github.head_ref, 'train/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',ladders,'))
    name: ${{ matrix.name }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: generator-1-level-20
            name: generator seed 1 level 20
            component: generator
            flags: --seed 1 --levels 20..20
          - id: generator-1-level-21
            name: generator seed 1 level 21
            component: generator
            flags: --seed 1 --levels 21..21
          - id: generator-1-level-22
            name: generator seed 1 level 22
            component: generator
            flags: --seed 1 --levels 22..22
          - id: generator-1-level-23
            name: generator seed 1 level 23
            component: generator
            flags: --seed 1 --levels 23..23
          - id: generator-2-level-20
            name: generator seed 2 level 20
            component: generator
            flags: --seed 2 --levels 20..20
          - id: generator-2-level-21
            name: generator seed 2 level 21
            component: generator
            flags: --seed 2 --levels 21..21
          - id: generator-2-level-22
            name: generator seed 2 level 22
            component: generator
            flags: --seed 2 --levels 22..22
          - id: generator-2-level-23
            name: generator seed 2 level 23
            component: generator
            flags: --seed 2 --levels 23..23
          - id: generator-3-level-20
            name: generator seed 3 level 20
            component: generator
            flags: --seed 3 --levels 20..20
          - id: generator-3-level-21
            name: generator seed 3 level 21
            component: generator
            flags: --seed 3 --levels 21..21
          - id: generator-3-level-22
            name: generator seed 3 level 22
            component: generator
            flags: --seed 3 --levels 22..22
          - id: generator-3-level-23
            name: generator seed 3 level 23
            component: generator
            flags: --seed 3 --levels 23..23
          - id: generator-hidden-level-20
            name: generator seed hidden level 20
            component: generator
            flags: --hidden --hidden-only --levels 20..20
          - id: generator-hidden-level-21
            name: generator seed hidden level 21
            component: generator
            flags: --hidden --hidden-only --levels 21..21
          - id: generator-hidden-level-22
            name: generator seed hidden level 22
            component: generator
            flags: --hidden --hidden-only --levels 22..22
          - id: generator-hidden-level-23
            name: generator seed hidden level 23
            component: generator
            flags: --hidden --hidden-only --levels 23..23
    steps:
      # A stalled repository fetch is cut after 3 minutes and tried once more, so it cannot hold the job for its timeout.
      - uses: actions/checkout@v7
        id: checkout
        timeout-minutes: 3
        continue-on-error: true
      - uses: actions/checkout@v7
        if: steps.checkout.outcome != 'success'
        timeout-minutes: 10
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          check-latest: true
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run this level
        shell: bash
        env:
          FLAGS: ${{ matrix.flags }}
          LEG: ${{ matrix.id }}
        run: |
          mkdir -p report
          pnpm -s driftbench validate generator $FLAGS --json > "report/$LEG.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ladders-${{ matrix.id }}
          path: report
          retention-days: 3
          if-no-files-found: ignore

  ladders-handover:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'train/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',ladders,'))
    name: every handover agrees with its journal
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      # A stalled repository fetch is cut after 3 minutes and tried once more, so it cannot hold the job for its timeout.
      - uses: actions/checkout@v7
        id: checkout
        timeout-minutes: 3
        continue-on-error: true
      - uses: actions/checkout@v7
        if: steps.checkout.outcome != 'success'
        timeout-minutes: 10
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          check-latest: true
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Every handover agrees with its journal
        run: pnpm driftbench validate all --check-handover

  ladders:
    needs: [ladders-leg, ladders-tail, ladders-handover]
    if: always() && (github.event_name == 'push' || startsWith(github.head_ref, 'train/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',ladders,')))
    name: ladders and floors
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      # A stalled repository fetch is cut after 3 minutes and tried once more, so it cannot hold the job for its timeout.
      - uses: actions/checkout@v7
        id: checkout
        timeout-minutes: 3
        continue-on-error: true
      - uses: actions/checkout@v7
        if: steps.checkout.outcome != 'success'
        timeout-minutes: 10
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          check-latest: true
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@v4
        with:
          pattern: ladders-*
          path: reports
          merge-multiple: true
      - name: Every validator on seeds 1 to 3 and the hidden seed, at or above its floor
        run: pnpm driftbench validate all --reports reports --seeds 1..3 --hidden --check-floor
      - name: Every leg ran and succeeded
        if: always()
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          bad=0
          for result in ${RESULTS//,/ }; do
            if [[ "$result" != success ]]; then bad=1; fi
          done
          if [[ "$bad" -eq 1 ]]; then
            echo "::error::A job this one waits for did not succeed (results: $RESULTS). A skipped, failed or cancelled leg is a red run."
            exit 1
          fi
          echo "Every job this one waits for succeeded (results: $RESULTS)."

  system-leg:
    # Every level of the system ladder on one seed, in three slices: levels 1 to 9, level 10 and level 11.
    if: github.event_name == 'push' || startsWith(github.head_ref, 'train/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',system-full,'))
    name: ${{ matrix.name }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: system-s1-1-9
            name: system seed 1 levels 1 to 9
            component: system
            flags: --seed 1 --levels 1..9
          - id: system-s1-10-10
            name: system seed 1 levels 10 to 10
            component: system
            flags: --seed 1 --levels 10..10
          - id: system-s1-11-11
            name: system seed 1 levels 11 to 11
            component: system
            flags: --seed 1 --levels 11..11
          - id: system-s2-1-9
            name: system seed 2 levels 1 to 9
            component: system
            flags: --seed 2 --levels 1..9
          - id: system-s2-10-10
            name: system seed 2 levels 10 to 10
            component: system
            flags: --seed 2 --levels 10..10
          - id: system-s2-11-11
            name: system seed 2 levels 11 to 11
            component: system
            flags: --seed 2 --levels 11..11
          - id: system-s3-1-9
            name: system seed 3 levels 1 to 9
            component: system
            flags: --seed 3 --levels 1..9
          - id: system-s3-10-10
            name: system seed 3 levels 10 to 10
            component: system
            flags: --seed 3 --levels 10..10
          - id: system-s3-11-11
            name: system seed 3 levels 11 to 11
            component: system
            flags: --seed 3 --levels 11..11
          - id: system-hidden-1-9
            name: system seed hidden levels 1 to 9
            component: system
            flags: --hidden --hidden-only --levels 1..9
          - id: system-hidden-10-10
            name: system seed hidden levels 10 to 10
            component: system
            flags: --hidden --hidden-only --levels 10..10
          - id: system-hidden-11-11
            name: system seed hidden levels 11 to 11
            component: system
            flags: --hidden --hidden-only --levels 11..11
    steps:
      # A stalled repository fetch is cut after 3 minutes and tried once more, so it cannot hold the job for its timeout.
      - uses: actions/checkout@v7
        id: checkout
        timeout-minutes: 3
        continue-on-error: true
      - uses: actions/checkout@v7
        if: steps.checkout.outcome != 'success'
        timeout-minutes: 10
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          check-latest: true
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run this leg
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          FLAGS: ${{ matrix.flags }}
          LEG: ${{ matrix.id }}
        run: |
          mkdir -p report
          pnpm -s driftbench validate "$COMPONENT" $FLAGS --json > "report/$LEG.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-full-${{ matrix.id }}
          path: report
          retention-days: 3

  system-full:
    needs: system-leg
    if: always() && (github.event_name == 'push' || startsWith(github.head_ref, 'train/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',system-full,')))
    name: system all 11 levels
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      # A stalled repository fetch is cut after 3 minutes and tried once more, so it cannot hold the job for its timeout.
      - uses: actions/checkout@v7
        id: checkout
        timeout-minutes: 3
        continue-on-error: true
      - uses: actions/checkout@v7
        if: steps.checkout.outcome != 'success'
        timeout-minutes: 10
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          check-latest: true
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@v4
        with:
          pattern: system-full-*
          path: reports
          merge-multiple: true
      - name: Every system level on seeds 1 to 3 and the hidden seed
        shell: bash
        run: |
          # A plain full run returns the level reached, so success here is 11, not 0.
          status=0
          if pnpm driftbench validate system --reports reports --seeds 1..3 --hidden --all-levels; then
            status=0
          else
            status=$?
          fi
          test "$status" -eq 11
      - name: Every leg ran and succeeded
        if: always()
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          bad=0
          for result in ${RESULTS//,/ }; do
            if [[ "$result" != success ]]; then bad=1; fi
          done
          if [[ "$bad" -eq 1 ]]; then
            echo "::error::A job this one waits for did not succeed (results: $RESULTS). A skipped, failed or cancelled leg is a red run."
            exit 1
          fi
          echo "Every job this one waits for succeeded (results: $RESULTS)."


  pointer-measure:
    # The pointer bank on chosen seeds, in shards, for the independent audit (docs/validators.md section 12.7 and
    # 8.1). A dispatch on a train/* branch names the job in `jobs`: `pointer-measure` runs seeds 1 to 3 and the
    # hidden seed in 3 shards, `pointer-measure-one` runs seed 1 in 1 shard (a planted-bug or cheat check) and
    # `pointer-measure-full` runs seeds 1 to 20 and the hidden seed in 10 shards (a gate measurement only). Each
    # shard uploads the report `driftbench validate pointer --items --all-levels --json` prints. The exit code is the
    # level reached, so the step records it and never fails the job on it. The job never runs on a push or a pull
    # request.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && (contains(format(',{0},', inputs.jobs), ',pointer-measure,') || contains(format(',{0},', inputs.jobs), ',pointer-measure-one,') || contains(format(',{0},', inputs.jobs), ',pointer-measure-full,'))
    name: pointer bank seeds ${{ matrix.seeds }}${{ matrix.hidden && ' and hidden' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(contains(format(',{0},', inputs.jobs), ',pointer-measure-full,') && '[{"seeds":"1..2","hidden":true},{"seeds":"3..4","hidden":false},{"seeds":"5..6","hidden":false},{"seeds":"7..8","hidden":false},{"seeds":"9..10","hidden":false},{"seeds":"11..12","hidden":false},{"seeds":"13..14","hidden":false},{"seeds":"15..16","hidden":false},{"seeds":"17..18","hidden":false},{"seeds":"19..20","hidden":false}]' || contains(format(',{0},', inputs.jobs), ',pointer-measure-one,') && '[{"seeds":"1..1","hidden":false}]' || '[{"seeds":"1..1","hidden":false},{"seeds":"2..2","hidden":false},{"seeds":"3..3","hidden":true}]') }}
    steps:
      # A stalled repository fetch is cut after 3 minutes and tried once more, so it cannot hold the job for its timeout.
      - uses: actions/checkout@v7
        id: checkout
        timeout-minutes: 3
        continue-on-error: true
      - uses: actions/checkout@v7
        if: steps.checkout.outcome != 'success'
        timeout-minutes: 10
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Measure the shard
        shell: bash
        env:
          SEEDS: ${{ matrix.seeds }}
          HIDDEN: ${{ matrix.hidden && '--hidden' || '' }}
        run: |
          status=0
          pnpm -s driftbench validate pointer --seeds "$SEEDS" $HIDDEN --items --all-levels --json > pointer-items.json || status=$?
          echo "level (exit code) $status"
          test -s pointer-items.json
          node -e 'const r = JSON.parse(require("node:fs").readFileSync("pointer-items.json", "utf8")); console.log("bank", r.bank.passing, "of", r.bank.size, "head", process.env.GITHUB_SHA)'
      - uses: actions/upload-artifact@v4
        with:
          name: pointer-items-${{ strategy.job-index }}
          path: pointer-items.json

  variables-measure:
    # The variables bank on chosen seeds, in shards, for the independent audit (docs/validators.md section 12.7 and
    # 8.1). A dispatch on a train/* branch names the job in `jobs`: `variables-measure` runs seeds 1 to 3 and the
    # hidden seed in 3 shards, `variables-measure-one` runs seed 1 in 1 shard (a planted-bug or cheat check) and
    # `variables-measure-full` runs seeds 1 to 20 and the hidden seed in 10 shards (a gate measurement only). Each
    # shard uploads the report `driftbench validate variables --items --all-levels --json` prints. The exit code is the
    # level reached, so the step records it and never fails the job on it. The job never runs on a push or a pull
    # request.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && (contains(format(',{0},', inputs.jobs), ',variables-measure,') || contains(format(',{0},', inputs.jobs), ',variables-measure-one,') || contains(format(',{0},', inputs.jobs), ',variables-measure-full,'))
    name: variables bank seeds ${{ matrix.seeds }}${{ matrix.hidden && ' and hidden' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(contains(format(',{0},', inputs.jobs), ',variables-measure-full,') && '[{"seeds":"1..2","hidden":true},{"seeds":"3..4","hidden":false},{"seeds":"5..6","hidden":false},{"seeds":"7..8","hidden":false},{"seeds":"9..10","hidden":false},{"seeds":"11..12","hidden":false},{"seeds":"13..14","hidden":false},{"seeds":"15..16","hidden":false},{"seeds":"17..18","hidden":false},{"seeds":"19..20","hidden":false}]' || contains(format(',{0},', inputs.jobs), ',variables-measure-one,') && '[{"seeds":"1..1","hidden":false}]' || '[{"seeds":"1..1","hidden":false},{"seeds":"2..2","hidden":false},{"seeds":"3..3","hidden":true}]') }}
    steps:
      # A stalled repository fetch is cut after 3 minutes and tried once more, so it cannot hold the job for its timeout.
      - uses: actions/checkout@v7
        id: checkout
        timeout-minutes: 3
        continue-on-error: true
      - uses: actions/checkout@v7
        if: steps.checkout.outcome != 'success'
        timeout-minutes: 10
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Measure the shard
        shell: bash
        env:
          SEEDS: ${{ matrix.seeds }}
          HIDDEN: ${{ matrix.hidden && '--hidden' || '' }}
        run: |
          status=0
          pnpm -s driftbench validate variables --seeds "$SEEDS" $HIDDEN --items --all-levels --json > variables-items.json || status=$?
          echo "level (exit code) $status"
          test -s variables-items.json
          node -e 'const r = JSON.parse(require("node:fs").readFileSync("variables-items.json", "utf8")); console.log("bank", r.bank.passing, "of", r.bank.size, "head", process.env.GITHUB_SHA)'
      - uses: actions/upload-artifact@v4
        with:
          name: variables-items-${{ strategy.job-index }}
          path: variables-items.json

  protect:
    name: executor branches leave the validators alone
    if: github.event_name == 'pull_request'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      # A stalled repository fetch is cut after 3 minutes and tried once more, so it cannot hold the job for its timeout.
      - uses: actions/checkout@v7
        id: checkout
        timeout-minutes: 3
        continue-on-error: true
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        if: steps.checkout.outcome != 'success'
        timeout-minutes: 10
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          check-latest: true
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Refuse protected changes from an exec/ branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: pnpm driftbench validate protect --branch "$HEAD_REF" --base "origin/$BASE_REF"
