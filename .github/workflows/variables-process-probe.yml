name: variables process probe
on:
  push:
    branches: [train/codex-var-process-red]
    paths: [.github/workflows/variables-process-probe.yml]
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [red-and-candidate, candidate]
        default: red-and-candidate
        required: true
      baseline_run:
        type: string
        default: ''
      patch:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  red:
    if: github.event_name == 'push' || inputs.phase == 'red-and-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Honest release seeds 1 to 3
        run: |
          status=0
          pnpm -s driftbench validate variables --seeds 1..3 --items --all-levels --json > baseline.json || status=$?
          test "$status" -lt 64
          pnpm -s driftbench validate variables --hardness --json > baseline-hardness.json || test "$?" -eq 1
      - name: Adversarial assertions against release next (must be red)
        run: pnpm exec vitest run packages/validators/test/variables/process-isolation.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=red-tests.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: variables-release-red
          path: |
            baseline.json
            baseline-hardness.json
            red-tests.json

  candidate:
    needs: red
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply candidate supplied as data
        env:
          CANDIDATE_PATCH: ${{ inputs.patch }}
          DEFAULT_PATCH: 
        run: |
          if [ -n "$CANDIDATE_PATCH" ]; then
            printf '%s' "$CANDIDATE_PATCH" > /tmp/candidate.patch
          else
            printf '%s' "$DEFAULT_PATCH" | base64 -d > /tmp/candidate.patch
          fi
          git apply /tmp/candidate.patch
      - uses: actions/download-artifact@v4
        with:
          name: variables-release-red
          run-id: ${{ inputs.baseline_run || github.run_id }}
          github-token: ${{ github.token }}
          path: release-evidence
      - name: Format and lint variables files on GitHub
        run: pnpm exec biome check --write packages/validators/src/ladders/variables packages/validators/test/variables
      - name: Typecheck candidate on GitHub
        if: always()
        run: pnpm typecheck
      - name: Adversarial candidate tests
        if: always()
        run: pnpm exec vitest run packages/validators/test/variables/process-isolation.test.ts packages/validators/test/variables/product-process.test.ts packages/validators/test/variables/canary-ladder.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=candidate-tests.json
      - name: Honest candidate seeds 1 to 3 and hardness
        if: always()
        run: |
          status=0
          pnpm -s driftbench validate variables --seeds 1..3 --items --all-levels --json > candidate.json || status=$?
          test "$status" -lt 64
          pnpm -s driftbench validate variables --hardness --json > candidate-hardness.json || test "$?" -eq 1
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const before = JSON.parse(fs.readFileSync('release-evidence/baseline.json'));
          const after = JSON.parse(fs.readFileSync('candidate.json'));
          for (const run of before.seeds) {
            const found = after.seeds.find((next) => next.seed === run.seed);
            if (!found || found.level < run.level) throw new Error('honest seed level dropped: ' + run.seed);
          }
          console.log(JSON.stringify({kind:'variables-parity',before:before.seeds.map(({seed,level})=>({seed,level})),after:after.seeds.map(({seed,level})=>({seed,level}))}));
          JS
      - name: Save formatted candidate
        if: always()
        run: |
          git add packages/validators/src/ladders/variables packages/validators/test/variables
          git diff --cached --binary > candidate-formatted.patch
          tar -czf candidate-sources.tgz packages/validators/src/ladders/variables packages/validators/test/variables
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: variables-candidate
          path: |
            candidate-formatted.patch
            candidate-sources.tgz
            candidate-tests.json
            candidate.json
            candidate-hardness.json
