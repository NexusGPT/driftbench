name: gate-b probe

# Temporary: formats the gold-chain tests, prints the diff and runs them.
on:
  pull_request:
    paths:
      - .github/workflows/gate-b-probe.yml

permissions:
  contents: read

jobs:
  probe:
    name: gate b probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          check-latest: true
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format and print the diff
        run: |
          pnpm exec biome check --write packages/cli/test/gold-chain || true
          git diff
      - name: Sonnet step 3
        continue-on-error: true
        env:
          GOLD_ASK_MODEL: claude-sonnet-5-5
          GOLD_PRINT_STEP3: "1"
        run: pnpm exec vitest run packages/cli/test/gold-chain --maxWorkers=2
      - name: Haiku gate unchanged
        run: pnpm exec vitest run packages/cli/test/gold-chain packages/cli/test/gold-chain/heldout-harness.test.ts --maxWorkers=2
