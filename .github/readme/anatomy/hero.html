<!doctype html><html lang="en"><head><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&family=Libre+Caslon+Display&display=swap" rel="stylesheet"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>driftbench hero</title><style>

  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;

.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}

.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}

.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}

.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}

.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}

.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}

.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}

.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}

.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}

.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}

.iso-plate .iso-svg{margin:0 auto}

.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}

</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>/* The anatomy of driftbench, in the Nexus design system v1: Libre Caslon for the title, Geist for text,
   Geist Mono for labels, a page of #F6F8FB, white panels on frosted glass over a faint blue silk, and the
   #FF6600 spark spent once, on the deviation punch's lamp. The kit's tones are cooled toward the brand's
   navy ink. Light ships first; dark is the same figure on DeepBlue silk. */
.iso[data-theme="light"] {
  --anatomy-page: #f6f8fb;
  --anatomy-card: #ffffff;
  --anatomy-text: #4a5873;
  --anatomy-strong: #0e1116;
  --anatomy-muted: #7d879a;
  --anatomy-paper: #ffffff;
  --anatomy-face: #ffffff;
  --anatomy-top: #ffffff;
  --anatomy-shade-0: #d6dce8;
  --anatomy-shade-1: #e1e6ef;
  --anatomy-shade-2: #eaeef5;
  --anatomy-shade-3: #f3f5f9;
  --anatomy-lit-top: #ffffff;
  --anatomy-lit-shade: #eef1f6;
  --anatomy-hi: #1b2a44;
  --anatomy-mid: #76829a;
  --anatomy-lo: #aab3c4;
  --anatomy-faint: #d2d8e3;
  --anatomy-lit: #0e1116;
  --anatomy-halo: #4a5873;
  --anatomy-halo-opacity: 0.24;
  --anatomy-dot: #1b2a44;
  --an-silk: url("../src/silk/silkrow-1920x1080.jpg");
  --an-silk-fallback: #d6e3f9;
  --an-glass: rgba(255, 255, 255, 0.46);
  --an-glass-border: rgba(255, 255, 255, 0.6);
  --an-glass-rim: inset 0 1px 0 rgba(255, 255, 255, 0.9);
  --an-glass-shadow: 0 20px 40px -28px rgba(14, 30, 60, 0.35);
  --an-panel-shadow: 0 8px 18px rgba(14, 30, 60, 0.12), 0 0 0 1px rgba(14, 17, 22, 0.06);
  --an-chart-paper: #fbfcfe;
  --an-window: #f1f4f9;
  --an-spark: #ff6600;
}
.iso[data-theme="dark"] {
  --anatomy-page: #060a14;
  --anatomy-card: #12161e;
  --anatomy-text: #b9c2d3;
  --anatomy-strong: #f5f3f0;
  --anatomy-muted: #7d879a;
  --anatomy-paper: #12161e;
  --anatomy-face: #171c26;
  --anatomy-top: #1b212c;
  --anatomy-shade-0: #0c1017;
  --anatomy-shade-1: #0f131b;
  --anatomy-shade-2: #12171f;
  --anatomy-shade-3: #161b24;
  --anatomy-lit-top: #232a37;
  --anatomy-lit-shade: #1a202b;
  --anatomy-hi: #e3e8f2;
  --anatomy-mid: #7d889c;
  --anatomy-lo: #4b5466;
  --anatomy-faint: #2c3340;
  --anatomy-lit: #ffffff;
  --anatomy-halo: #000000;
  --anatomy-halo-opacity: 0.8;
  --anatomy-dot: #e3e8f2;
  --an-silk: url("../src/silk/deepblue-1920x1080.jpg");
  --an-silk-fallback: #06122b;
  --an-glass: rgba(7, 11, 20, 0.38);
  --an-glass-border: rgba(255, 255, 255, 0.2);
  --an-glass-rim: inset 0 1px 0 rgba(255, 255, 255, 0.14);
  --an-glass-shadow: 0 20px 40px -28px rgba(0, 0, 0, 0.6);
  --an-panel-shadow: 0 8px 18px rgba(0, 0, 0, 0.34), 0 0 0 1px rgba(255, 255, 255, 0.08);
  --an-chart-paper: #0f131b;
  --an-window: #0c1017;
  --an-spark: #ff6600;
}
.iso {
  --anatomy-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --an-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --an-serif: "Libre Caslon Display", Georgia, serif;
}
body.iso {
  font-family: var(--an-sans);
}
.an-head {
  margin: 0 4px 22px;
}
.an-kicker {
  margin: 0 0 10px;
  font: 500 11px/1 var(--anatomy-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--anatomy-muted);
}
.an-title {
  margin: 0;
  font: 400 34px/1.1 var(--an-serif);
  letter-spacing: -0.012em;
  color: var(--anatomy-strong);
}
.an-frame {
  border-radius: 24px;
  padding: 10px;
  background: var(--an-silk-fallback) var(--an-silk) center / cover;
}
.an-frame .iso-figure {
  margin: 0;
  padding: 12px;
  border-radius: 16px;
  background: var(--an-glass);
  border: 1px solid var(--an-glass-border);
  box-shadow: var(--an-glass-rim), var(--an-glass-shadow);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  backdrop-filter: blur(14px) saturate(1.2);
}
.an-frame .iso-plate {
  border-radius: 12px;
  box-shadow: var(--an-panel-shadow);
  padding: 44px 18px 48px;
}
.an-frame .iso-plate-corner {
  font-size: 11px;
}
.an-stage {
  outline: none;
  touch-action: pan-y;
}
.an-stage:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 6px;
}
.an-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.an-parts {
  list-style: none;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px 18px;
  margin: 18px 4px 0;
  padding: 0;
}
.an-part {
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-areas: "n name" "n text";
  column-gap: 10px;
  width: 100%;
  padding: 8px 10px;
  border: 0;
  border-radius: 10px;
  background: none;
  color: inherit;
  text-align: left;
  cursor: pointer;
  font: inherit;
}
.an-part:hover,
.an-part:focus-visible,
.an-part[data-on] {
  background: color-mix(in srgb, var(--anatomy-card) 70%, transparent);
  box-shadow: var(--an-panel-shadow);
  outline: none;
}
.an-n {
  grid-area: n;
  font: 500 11px/1.5 var(--anatomy-mono);
  color: var(--anatomy-muted);
}
.an-name {
  grid-area: name;
  font: 600 13px/1.35 var(--an-sans);
  color: var(--anatomy-strong);
}
.an-text {
  grid-area: text;
  font: 400 12.5px/1.45 var(--an-sans);
  color: var(--anatomy-text);
}
.an-caption {
  margin: 18px 4px 0;
  font: 400 13.5px/1.6 var(--an-sans);
  color: var(--anatomy-text);
}
.an-tools {
  margin: 14px 4px 0;
}
.an-theme {
  padding: 6px 12px;
  border: 1px solid color-mix(in srgb, var(--anatomy-muted) 40%, transparent);
  border-radius: 999px;
  background: none;
  color: var(--anatomy-text);
  font: 500 11px/1 var(--anatomy-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}
@media (max-width: 760px) {
  .an-parts {
    grid-template-columns: 1fr;
  }
  .an-title {
    font-size: 26px;
  }
}
/* On a phone the machine runs edge to edge: the drawing is scaled up and its empty corners are cropped. */
@media (max-width: 560px) {
  .an-frame .iso-plate {
    overflow: hidden;
    padding: 40px 0 70px;
  }
  .an-frame .iso-plate .iso-svg {
    width: 116%;
    margin: -10px -8% -12px;
  }
  .an-frame .iso-plate-corners {
    inset: 14px 14px;
  }
  .an-frame .iso-plate-corner[data-corner="hint"] {
    display: none;
  }
  .an-frame .iso-plate-corner[data-corner="readout"] {
    left: 0;
    white-space: normal;
    text-align: right;
    line-height: 1.45;
  }
}

/* parts the live script drives */
[data-lamp][data-on] .iso-top,
[data-lamp][data-on] .iso-shade,
[data-lamp][data-on] .iso-fill {
  fill: var(--anatomy-hi);
  stroke: var(--anatomy-hi);
}
.an-peg {
  fill: var(--anatomy-paper);
  stroke: var(--anatomy-lo);
  stroke-width: 0.5;
  vector-effect: non-scaling-stroke;
}
.an-peg[data-on] {
  fill: var(--anatomy-hi);
  stroke: var(--anatomy-hi);
}
.an-spark-dot {
  fill: var(--anatomy-lo);
  transition: fill 160ms linear;
}
.an-spark[data-on] .an-spark-dot {
  fill: var(--an-spark);
}
.an-paper {
  fill: var(--an-chart-paper);
  stroke: var(--anatomy-lo);
  stroke-width: 0.6;
  vector-effect: non-scaling-stroke;
}
.an-chart-mid,
.an-grid {
  fill: none;
  stroke: var(--anatomy-faint);
  stroke-width: 0.6;
  vector-effect: non-scaling-stroke;
}
.an-chart-mid {
  stroke: var(--anatomy-lo);
}
.an-trace {
  fill: none;
  stroke: var(--anatomy-hi);
  stroke-width: 1;
  stroke-linejoin: round;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
}
.an-event {
  fill: none;
  stroke: var(--anatomy-mid);
  stroke-width: 0.8;
  vector-effect: non-scaling-stroke;
}
.an-pen {
  fill: var(--anatomy-hi);
}
.an-pen-arm {
  fill: none;
  stroke: var(--anatomy-mid);
  stroke-width: 0.7;
  vector-effect: non-scaling-stroke;
}
.an-dial-face {
  fill: var(--an-chart-paper);
  stroke: var(--anatomy-lo);
  stroke-width: 0.6;
  vector-effect: non-scaling-stroke;
}
.an-tick {
  fill: none;
  stroke: var(--anatomy-lo);
  stroke-width: 0.6;
  vector-effect: non-scaling-stroke;
}
.an-tick[data-major] {
  stroke: var(--anatomy-mid);
}
.an-band {
  fill: var(--anatomy-shade-0);
  stroke: var(--anatomy-mid);
  stroke-width: 0.5;
  vector-effect: non-scaling-stroke;
}
.an-notch {
  fill: var(--anatomy-hi);
}
.an-needle {
  fill: none;
  stroke: var(--anatomy-hi);
  stroke-width: 1.1;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
}
.an-pointer {
  fill: var(--anatomy-mid);
  stroke: none;
}
.an-hub {
  fill: var(--anatomy-paper);
  stroke: var(--anatomy-hi);
  stroke-width: 0.7;
  vector-effect: non-scaling-stroke;
}
.an-window {
  fill: var(--an-window);
  stroke: var(--anatomy-lo);
  stroke-width: 0.6;
  vector-effect: non-scaling-stroke;
}
.an-digits {
  fill: var(--anatomy-hi);
  font: 500 6.6px/1 var(--anatomy-mono);
  letter-spacing: 0.06em;
  font-variant-numeric: tabular-nums;
}
.an-car [data-flag][data-fail] .iso-top,
.an-car [data-flag][data-fail] .iso-shade {
  fill: var(--anatomy-hi);
}
.an-car [data-obs] {
  fill: var(--anatomy-hi);
  opacity: 0;
  transition: opacity 180ms linear;
}
.an-car [data-pad][data-seen] [data-obs] {
  opacity: 1;
}
.an-car [data-pad] [data-x] {
  opacity: 0;
}
.an-car [data-pad][data-bad] [data-x] {
  opacity: 1;
}
.an-car [data-token] {
  opacity: 0;
}
.an-car[data-injected] [data-token] {
  opacity: 1;
}
.an-car [data-pad][data-off] .an-bump {
  display: none;
}
.an-car[data-kind="task"] [data-given="talk"],
.an-car[data-kind="conversation"] [data-given="work"] {
  display: none;
}
.an-line .it,
.an-cars {
  transition: opacity 260ms linear;
}
.an-stage[data-focus] .an-line .it:not([data-on]) {
  opacity: 0.22;
}

/* The README hero: the anatomy machine as the main visual, the cover's text block on the left. One picture: the

html,
body {
  margin: 0;
  padding: 0;
}
.iso-page {
  width: auto;
  margin: 0;
}
.an-hero {
  position: relative;
  width: 1600px;
  height: 900px;
  overflow: hidden;
  background:
    linear-gradient(90deg, rgba(246, 248, 251, 0) 0%, rgba(246, 248, 251, 0) 18%, var(--anatomy-paper) 37%),

}
.iso[data-theme="light"] .an-hero {
  --anatomy-paper: #f6f8fb;
  --anatomy-card: #f6f8fb;

  --hero-ink: #0e1116;
  --hero-soft: rgba(14, 17, 22, 0.68);
}
.iso[data-theme="dark"] .an-hero {
  --hero-ink: #f5f3f0;
  --hero-soft: rgba(245, 243, 240, 0.7);
  background:
    linear-gradient(90deg, rgba(18, 22, 30, 0) 0%, rgba(18, 22, 30, 0) 18%, var(--anatomy-paper) 37%),
    #06122b url("../src/silk/deepblue-1920x1080.jpg") left center / auto 100%;
}
.hero-logo {
  position: absolute;
  left: 96px;
  top: 70px;
  width: 120px;
}
.iso[data-theme="light"] .hero-logo--white,
.iso[data-theme="dark"] .hero-logo--ink {
  display: none;
}
.hero-label {
  position: absolute;
  left: 96px;
  bottom: 64px;
  font: 500 15px/1 var(--anatomy-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--hero-soft);
}
.hero-copy {
  position: absolute;
  left: 96px;
  top: 214px;
  width: 470px;
}

  align-items: center;

.hero-title {

        const hi = align(arc, b.groups.get(tone)[index]);
        for (const key of ["from", "to"]) {
          const p = pointAt(i, mid.u, arc[key]);
          const p0 = pointAt(i, a.u, lo[key]);
          const p1 = pointAt(i, b.u, hi[key]);
          worst = Math.max(worst, Math.hypot(p[0] - (p0[0] + p1[0]) / 2, p[1] - (p0[1] + p1[1]) / 2));
        }
      });
    }
    return worst;
  };
  const sheet = (tone, levels) => {
    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));
      buckets[tone].push(pathOf(oriented(points), true));
    });
  };
  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,

  const dz = Math.sin(angle) * half;
  const a = [Math.cos(angle), 0, Math.sin(angle)];
  const F = G.frameOf([j.x, j.y, z], a, [0, 1, 0], G.unit3(G.cross3(a, [0, 1, 0])));
  const beamPaths = G.prismOf(F, [[-0.9 * j.size, -0.5], [0.9 * j.size, -0.5], [0.9 * j.size, 0.5], [-0.9 * j.size, 0.5]], -half, half, P);
  const pan = (sx) => {
    const cx = j.x + sx * dx;
    const cz = z + sx * dz;
    return S(cylinder(cx, j.y, 0.5 * j.size, cz, 2 * j.size, P, 10), { tone: 'mid', crease: 'none' }) + S(cylinder(cx, j.y, 3.4 * j.size, cz + 2 * j.size, 0.8, P, 28), { tone: 'hi' });
  };
  const left = pan(-1);
  const right = pan(1);
  return left + S(beamPaths, { tone: 'mid' }) + right;
}

// the dial, drawn flat in the plane of the console face
const SWEEP = (240 * Math.PI) / 180;
const angleOf = (v) => -SWEEP / 2 + SWEEP * clamp(v, 0, 1);
const polar = (r, a) => [r * Math.sin(a), -r * Math.cos(a)];
const R0 = D.dial.r - 1.8;
function arcPath(r, a0, a1) {
  const p0 = polar(r, a0);
  const p1 = polar(r, a1);
  return `M${f2(p0[0])} ${f2(p0[1])}A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${f2(p1[0])} ${f2(p1[1])}`;
}
{
  const ticks = [];
  for (let i = 0; i <= 20; i++) {
    const a = angleOf(i / 20);
    const major = i % 2 === 0;
    const [x0, y0] = polar(R0 - (major ? 4.2 : 2.6), a);
    const [x1, y1] = polar(R0, a);
    ticks.push(`<path class="an-tick"${major ? ' data-major=""' : ''} d="M${f2(x0)} ${f2(y0)}L${f2(x1)} ${f2(y1)}"/>`);
  }
  const t = angleOf(D.model.threshold);
  const notch = [polar(R0 + 1.6, t - 0.07), polar(R0 + 1.6, t + 0.07), polar(R0 - 1.4, t)];
  el.dial.innerHTML = `<circle class="an-dial-face" r="${R0 + 1.6}"/><path class="an-tick" d="${arcPath(R0, -SWEEP / 2, SWEEP / 2)}"/>${ticks.join('')}<path class="an-notch" d="M${notch.map((p) => p.map(f2).join(' ')).join('L')}Z"/><path class="an-band" data-band d=""/><g data-lo><path class="an-pointer" d="M-1.1 ${-R0 + 7}L1.1 ${-R0 + 7}L0 ${-R0 + 2.4}Z"/></g><g data-hi><path class="an-pointer" d="M-1.1 ${-R0 + 7}L1.1 ${-R0 + 7}L0 ${-R0 + 2.4}Z"/></g><g data-needle><path class="an-needle" d="M0 4L0 ${-R0 + 3.4}"/></g><circle class="an-hub" r="1.8"/>`;
}
const dialEl = { band: el.dial.querySelector('[data-band]'), lo: el.dial.querySelector('[data-lo]'), hi: el.dial.querySelector('[data-hi]'), needle: el.dial.querySelector('[data-needle]') };
const dialState = { rate: { x: 0, v: 0 }, lo: { x: 0, v: 0 }, hi: { x: 1, v: 0 }, target: { rate: 0, lo: 0, hi: 1 } };

// the chart: one division per block, the pen at the right, an event mark under every injected block
const CH = D.chart;
const DIV = 4.2;
const PEN_X = CH.w - 7;
const MID = CH.h / 2;
const AMP = CH.h * 0.36;
const chartState = { records: [], scroll: { x: 0, v: 0 }, pen: { x: 0, v: 0 } };
el.grid.innerHTML = `<path class="an-grid" d="M0 ${f2(MID - AMP)}H${CH.w}M0 ${f2(MID + AMP)}H${CH.w}"/>`;

// the CI gate arm, rebuilt as it turns
const GATE_PIVOT = [D.gate.x + 6, D.gate.y, 50];
const gateState = { angle: { x: 0, v: 0 }, target: 0, drawn: null };
function gateSvg(theta) {
  const a = [0, Math.cos(theta), Math.sin(theta)];
  const u = [1, 0, 0];
  const v = G.unit3(G.cross3(a, u));
  const F = G.frameOf(GATE_PIVOT, a, u, v);
  const section = (h) => [[-1, -h], [1, -h], [1, h], [-1, h]];
  const parts = [S(G.prismOf(F, section(2.6), -10, -3, P), { tone: 'mid' })];
  for (let i = 0; i < 6; i++) parts.push(S(G.prismOf(F, section(1.5), 2 + i * 9.4, 2 + (i + 1) * 9.4, P), { tone: i % 2 ? 'mid' : 'hi' }));
  return parts.join('');
}

// ------------------------------------------------------------------ the campaign
const STEP = 0.95;
const MOVE = 0.4;
const DECIDE = 2.6;
const GENERATE = 1.5;
const state = {
  mode: 'T',
  queue: [],
  slots: [null, null, null, null, null, null],
  exiting: null,
  binned: null,
  falling: null,
  stepAt: 0,
  phase: 'idle',
  phaseAt: 0,
  runsDone: [],
  injected: 0,
  recovered: 0,
  adapter: 'conversation',
  shuttle: { x: D.adaptY.conversation, v: 0 },
  lever: { x: D.lever.T, v: 0 },
  link: { x: 1, v: 0 },
  linkTarget: 1,
  gate: 'pending',
  paused: false,
  touring: !still.matches,
  coverage: 0,
  cid: 0,
};
let clock = 0;

function buildQueue(mode) {
  const runs = D.campaigns[mode];
  const queue = [];
  runs.forEach((run, r) => {
    run.blocks.forEach((block, i) => {
      queue.push({ cid: state.cid, run: r, index: i, first: i === 0, last: i === run.blocks.length - 1, kind: run.kind, block, record: run, flag: 'pending', seen: false, checked: false, judged: false, recorded: false });
    });
  });
  return queue;
}

function startCampaign(mode) {
  state.cid += 1;
  state.mode = mode;
  state.queue = buildQueue(mode);
  state.runsDone = [];
  state.gate = 'pending';
  gateState.target = 0;
  state.phase = 'generate';
  state.phaseAt = clock;
  state.generated = state.generated || false;
  state.linkTarget = mode === 'T' ? 1 : 0;
  dialState.target = { rate: 0, lo: 0, hi: 1 };
  describe();
}

function statsNow() {
  return statsOf(D.campaigns[state.mode], state.runsDone.length);
}

// One index step: every block moves one slot along; the block at the end slides into the store.
function index() {
  if (state.binned) {
    state.binned.car.fadeFrom = clock;
  }
  if (state.exiting) {
    state.binned = state.exiting;
    state.binned.from = [D.exitX, 0, 0];
    state.binned.to = [229, 0, -8.6];
    state.binned.where = 'bin';
  }
  state.exiting = null;
  const leaving = state.slots[5];
  if (leaving) {
    leaving.from = [D.slots[5], 0, 0];
    leaving.to = [D.exitX, 0, 0];
    leaving.where = 'exit';
    state.exiting = leaving;
  }
  for (let s = 5; s > 0; s--) {
    const entry = state.slots[s - 1];
    state.slots[s] = entry;
    if (entry) {
      entry.from = [D.slots[s - 1], 0, 0];
      entry.to = [D.slots[s], 0, 0];
      entry.where = s;
    }
  }
  state.slots[0] = null;
  if (state.queue.length && state.phase === 'run') {
    const entry = state.queue.shift();
    const car = freeCar();
    entry.car = car;
    car.entry = entry;
    car.g.style.display = '';
    car.g.dataset.kind = entry.kind;
    car.g.removeAttribute('data-injected');
    car.fadeFrom = null;
    car.g.style.opacity = '1';
    for (const [name, pad] of Object.entries(car.pads)) {
      pad.toggleAttribute('data-off', entry.block.checks[name] === undefined);
      pad.removeAttribute('data-seen');
      pad.removeAttribute('data-bad');
    }
    setFlag(car, 'pending');
    entry.from = [D.slots[0], 0, 78];
    entry.to = [D.slots[0], 0, 0];
    entry.where = 0;
    entry.falling = true;
    state.slots[0] = entry;
  }
  state.stepAt = clock;
}

function setFlag(car, verdict) {
  car.flagVerdict = verdict;
  if (verdict === 'fail') car.flag.setAttribute('data-fail', '');
  else car.flag.removeAttribute('data-fail');
}

function lineEmpty() {
  return !state.queue.length && state.slots.every((s) => !s) && !state.exiting;
}

// ------------------------------------------------------------------ the loop
let frame = 0;
let last = 0;
let visible = false;
let idleTimer = 0;
let selected = null;
let said = '';

function springTo(s, target, dt, seconds, calm) {
  if (calm) {
    s.x = target;
    s.v = 0;
    return false;
  }
  const w = 1 / seconds;
  for (let i = 0; i < 4; i++) {
    s.v += (w * w * (target - s.x) - 2 * w * s.v) * (dt / 4);
    s.x += s.v * (dt / 4);
  }
  if (Math.abs(target - s.x) < 1e-4 && Math.abs(s.v) < 1e-4) {
    s.x = target;
    s.v = 0;
    return false;
  }
  return true;
}

function tick(now) {
  const real = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  const dt = state.paused ? 0 : real;
  clock += dt;
  advance(calm);
  draw(dt, calm);
  frame = visible ? requestAnimationFrame(tick) : 0;
}

function advance(calm) {
  if (state.phase === 'generate') {
    const span = state.generated ? 0.8 : GENERATE;
    const t = (clock - state.phaseAt) / span;
    if (!state.generated) state.coverage = Math.round(clamp(t, 0, 1) * D.coverage.covered);
    if (t >= 1 || calm) {
      state.coverage = D.coverage.covered;
      state.generated = true;
      state.phase = 'run';
      index();
    }
    return;
  }
  if (state.phase === 'run') {
    const t = clock - state.stepAt;
    act(t, calm);
    if (t >= STEP) {
      if (lineEmpty()) {
        decide();
        return;
      }
      index();
    }
    return;
  }
  if (state.phase === 'decide') {
    if (clock - state.phaseAt >= DECIDE && state.touring) {
      const next = state.mode === 'T' ? 'F' : state.mode === 'F' ? 'P' : 'T';
      startCampaign(next);
    }
  }
}

function decide() {
  const stats = statsNow();
  state.gate = stats.gate;
  gateState.target = stats.gate === 'pass' ? Math.PI / 2 - 0.08 : 0;
  state.phase = 'decide';
  state.phaseAt = clock;
  describe();
  announce(`${NAMES[state.mode]}: ${stats.n} runs, the gate ${stats.gate === 'pass' ? 'lifts' : 'holds'}.`);
}

// What each station does to the block under it during the dwell.
function act(t, calm) {
  const tau = t - MOVE;
  if (tau < 0) return;
  const at1 = state.slots[1];
  if (at1 && at1.block.injected && tau > 0.12 && !at1.injectedShown) {
    at1.injectedShown = true;
    at1.car.g.setAttribute('data-injected', '');
  }
  const at2 = state.slots[2];
  if (at2 && tau > 0.2 && !at2.seen) {
    at2.seen = true;
    for (const name of Object.keys(at2.block.checks)) at2.car.pads[name].setAttribute('data-seen', '');
  }
  const at3 = state.slots[3];
  if (at3 && tau > 0.22 && !at3.checked) {
    at3.checked = true;
    for (const [name, ok] of Object.entries(at3.block.checks)) if (!ok) at3.car.pads[name].setAttribute('data-bad', '');
    if (!at3.block.machinePass) setFlag(at3.car, 'fail');
  }
  const at4 = state.slots[4];
  if (at4 && tau > 0.36 && !at4.judged) {
    at4.judged = true;
    if (at4.block.machinePass) setFlag(at4.car, at4.block.judged.verdict);
  }
  const at5 = state.slots[5];
  if (at5 && tau > 0.08 && !at5.recorded) {
    at5.recorded = true;
    chartState.records.push({ offset: at5.block.offset, injected: at5.block.injected, first: at5.first });
    if (at5.last && at5.cid === state.cid) finishRun(at5);
  }
}

function finishRun(entry) {
  state.runsDone.push(entry.record);
  const stats = statsNow();
  dialState.target = { rate: stats.rate ?? 0, lo: stats.lo, hi: stats.hi };
  describe();
  if (entry.record.recovery) announce(`run ${stats.n}: recovery ${entry.record.recovery.label}`);
}

// ------------------------------------------------------------------ drawing
function pulse(tau, a, b, c, d) {
  if (tau < a) return 0;
  if (tau < b) return ease((tau - a) / (b - a));
  if (tau < c) return 1;
  if (tau < d) return 1 - ease((tau - c) / (d - c));
  return 0;
}

function draw(dt, calm) {
  const t = clock - state.stepAt;
  const move = state.phase === 'run' ? ease(t / MOVE) : 1;
  const tau = t - MOVE;
  // the blocks
  const entries = [...state.slots, state.exiting, state.binned].filter(Boolean);
  for (const entry of entries) {
    const car = entry.car;
    let p;
    if (entry.falling) {
      const f = easeIn(clamp(t / MOVE, 0, 1));
      p = [entry.to[0], 0, lerp(entry.from[2], entry.to[2], f)];
      if (f >= 1) entry.falling = false;
    } else if (entry.where === 'bin') {
      const slide = clamp(t / (MOVE * 0.7), 0, 1);
      const drop = easeIn(clamp((t - MOVE * 0.55) / (MOVE * 0.6), 0, 1));
      p = [lerp(entry.from[0], entry.to[0], ease(slide)), 0, lerp(0, entry.to[2], drop)];
    } else {
      p = [lerp(entry.from[0], entry.to[0], move), 0, 0];
    }
    car.pos = p;
    car.g.setAttribute('transform', translateAlong(P, p));
  }
  for (const car of cars) {
    if (car.fadeFrom != null && car.entry) {
      const f = clamp((clock - car.fadeFrom) / 0.5, 0, 1);
      car.g.style.opacity = String(1 - f);
      if (f >= 1) {
        car.entry = null;
        car.fadeFrom = null;
        car.g.style.display = 'none';
        if (state.binned && state.binned.car === car) state.binned = null;
      }
    }
  }
  // depth order of the blocks: far (left) first
  const shown = cars.filter((c) => c.entry);
  shown.sort((a, b) => depthOf([a.pos[0], 0, a.pos[2] + 18], P) - depthOf([b.pos[0], 0, b.pos[2] + 18], P));
  let i = 0;
  for (const car of shown) {
    if (carsLayer.children[i] !== car.g) carsLayer.insertBefore(car.g, carsLayer.children[i] || null);
    i++;
  }
  // couplings: down when free running or perturbed and the block behind belongs to the same run
  springTo(state.link, state.linkTarget, dt, 0.18, calm);
  for (const car of shown) {
    const entry = car.entry;
    const slot = typeof entry.where === 'number' ? entry.where : -1;
    const behind = slot > 0 ? state.slots[slot - 1] : null;
    const coupled = state.mode !== 'T' && behind && behind.cid === entry.cid && behind.run === entry.run && behind.index === entry.index + 1 && !behind.falling;
    const want = coupled ? 0 : 1.36;
    car.linkTarget = want;
    if (car.linkAngle < 0) car.linkAngle = want;
    const s = car.linkSpring || (car.linkSpring = { x: want, v: 0 });
    springTo(s, want, dt, 0.16, calm);
    if (Math.abs(s.x - car.linkAngle) > 0.002 || !car.link.innerHTML) {
      car.linkAngle = s.x;
      car.link.innerHTML = linkSvg(s.x);
    }
    // the verdict flag rises on a pass
    const up = car.flagVerdict === 'pass' ? 1 : 0;
    const fs = car.flagSpring || (car.flagSpring = { x: up, v: 0 });
    springTo(fs, up, dt, 0.12, calm);
    car.flag.setAttribute('transform', translateAlong(P, [0, 0, -4 + 4 * fs.x]));
  }
  // the walking beam lifts the blocks along and returns in the dwell
  const beamX = state.phase === 'run' ? (t < MOVE ? 64 * ease(t / MOVE) : 64 * (1 - ease((t - MOVE) / (STEP - MOVE)))) : 0;
  beam.setAttribute('transform', translateAlong(P, [beamX, 0, 0]));
  // the punch strikes the injected block at slot 1
  const at1 = state.slots[1];
  const strike = at1 && at1.block.injected && state.phase === 'run' ? pulse(tau, 0, 0.1, 0.16, 0.42) : 0;
  el.ram.setAttribute('transform', translateAlong(P, [0, 0, -4.4 * strike]));
  const lit = state.mode === 'P' && at1 && at1.block.injected && tau > -0.2 && state.phase === 'run';
  if (lit) el.spark.setAttribute('data-on', '');
  else el.spark.removeAttribute('data-on');
  // the agent cell: the shuttle brings the adapter this block needs, then lowers onto it
  const at2 = state.slots[2];
  const kindHere = at2 ? at2.kind : state.slots[1] ? state.slots[1].kind : state.adapter;
  state.adapter = kindHere;
  springTo(state.shuttle, D.adaptY[kindHere], dt, 0.14, calm);
  const press = at2 && state.phase === 'run' ? pulse(tau, 0.02, 0.16, 0.26, 0.5) : 0;
  el.shuttle.setAttribute('transform', translateAlong(P, [0, state.shuttle.x, -13 * press]));
  el.drawer.setAttribute('transform', translateAlong(P, [at2 && at2.kind === 'task' ? 4 * press : 0, 0, 0]));
  // the gantry head lowers its pins onto the Then plate; a failing pin's flag stays up
  const at3 = state.slots[3];
  const probe = at3 && state.phase === 'run' ? pulse(tau, 0.02, 0.18, 0.3, 0.52) : 0;
  el.head.setAttribute('transform', translateAlong(P, [0, 0, -21 * probe]));
  for (const [name, flag] of Object.entries(el.flags)) {
    const bad = at3 && at3.checked && at3.block.checks[name] === false;
    flag.setAttribute('transform', translateAlong(P, [0, 0, bad ? 3.4 * probe + 0.01 : 0]));
    flag.style.display = at3 && at3.checked && at3.block.checks[name] === false ? '' : 'none';
  }
  // the council: the class that owns the criterion votes; a split goes to the other class
  const at4 = state.slots[4];
  const judged = at4 && at4.block.machinePass ? at4.block.judged : null;
  const voteOf = (v) => (v === 'pass' ? -0.22 : v === 'fail' ? 0.22 : 0);
  for (const j of D.judges) {
    const js = judgeState[j.id];
    let target = 0;
    if (judged && state.phase === 'run' && tau > 0.04) {
      const idx = Number(j.id.split('.')[1]);
      if (j.cls === judged.cls) target = voteOf(judged.votes[idx]);
      if (judged.split && j.cls === judged.by && tau > 0.2) target = voteOf(judged.final[idx]);
    }
    const s = js.spring || (js.spring = { x: 0, v: 0 });
    springTo(s, target, dt, 0.09, calm);
    if (js.drawn === null || Math.abs(s.x - js.drawn) > 0.002) {
      js.drawn = s.x;
      el.judges[j.id].innerHTML = judgeSvg(j, s.x);
    }
  }
  const keyX = judged ? (judged.by === 'system1' ? -4 : 4) : 0;
  const ks = state.keySpring || (state.keySpring = { x: 0, v: 0 });
  springTo(ks, keyX, dt, 0.12, calm);
  el.key.setAttribute('transform', translateAlong(P, [ks.x, 0, 0]));
  // the lever
  springTo(state.lever, D.lever[state.mode], dt, 0.2, calm);
  el.lever.setAttribute('transform', translateAlong(P, [state.lever.x - D.lever.T, 0, 0]));
  // the validity gate's flap kicks once for every rejected candidate while the hopper generates
  let kick = 0;
  if (state.phase === 'generate' && !state.generated) {
    const t = (clock - state.phaseAt) / GENERATE;
    for (let r = 0; r < D.candidates.rejected; r++) kick = Math.max(kick, pulse(t, 0.18 + r * 0.26, 0.24 + r * 0.26, 0.28 + r * 0.26, 0.36 + r * 0.26));
  }
  el.flap.setAttribute('transform', translateAlong(P, [-2.2 * kick, 0, 0]));
  // the mode lamps on the console
  for (const lamp of el.lamps) lamp.toggleAttribute('data-on', lamp.dataset.lamp === state.mode);
  // the coverage pegboard
  el.pegs.forEach((peg, n) => {
    const covered = D.coverage.cells[n];
    const order = D.coverage.cells.slice(0, n + 1).filter(Boolean).length;
    const on = covered && order <= state.coverage;
    if (on !== peg.hasAttribute('data-on')) peg.toggleAttribute('data-on', on);
  });
  drawChart(dt, calm);
  drawDial(dt, calm);
  drawCounters();
  springTo(gateState.angle, gateState.target, dt, 0.35, calm);
  if (gateState.drawn === null || Math.abs(gateState.angle.x - gateState.drawn) > 0.002) {
    gateState.drawn = gateState.angle.x;
    el.gateArm.innerHTML = gateSvg(gateState.angle.x);
  }
  say();
}

function drawChart(dt, calm) {
  const n = chartState.records.length;
  springTo(chartState.scroll, n, dt, 0.18, calm);
  const last = chartState.records[n - 1];
  springTo(chartState.pen, last ? last.offset : 0, dt, 0.12, calm);
  const shift = chartState.scroll.x;
  const xOf = (i) => PEN_X - (shift - 1 - i) * DIV;
  const points = [];
  const marks = [];
  const lines = [];
  const from = Math.max(0, n - Math.ceil(PEN_X / DIV) - 2);
  for (let i = from; i < n; i++) {
    const x = xOf(i);
    const y = MID - AMP * chartState.records[i].offset;
    if (i === n - 1) points.push([x - DIV * 0.5, y], [Math.min(PEN_X, x), MID - AMP * chartState.pen.x]);
    else points.push([x - DIV * 0.5, y], [x + DIV * 0.5, y]);
    if (chartState.records[i].injected) marks.push(`M${f2(x)} ${CH.h}V${f2(CH.h - 4.4)}`);
    if (chartState.records[i].first) lines.push(`M${f2(x - DIV * 0.5)} 0V${CH.h}`);
  }
  const clipped = points.filter(([x]) => x >= 0.5).map(([x, y]) => [Math.min(x, PEN_X), y]);
  el.trace.innerHTML = `${lines.length ? `<path class="an-grid" d="${lines.filter((d) => Number(d.slice(1).split(' ')[0]) > 0.6).join('')}"/>` : ''}<path class="an-trace" d="${clipped.length > 1 ? `M${clipped.map((p) => p.map(f2).join(' ')).join('L')}` : ''}"/><path class="an-event" d="${marks.filter((d) => Number(d.slice(1).split(' ')[0]) > 0.6).join('')}"/>`;
  const py = MID - AMP * chartState.pen.x;
  el.pen.innerHTML = `<path class="an-pen-arm" d="M${PEN_X} 0V${f2(py - 1.6)}M${PEN_X} ${f2(py + 1.6)}V${CH.h}"/><rect class="an-pen" x="${PEN_X - 1.4}" y="${f2(py - 1.6)}" width="2.8" height="3.2" rx="0.6"/>`;
}

function drawDial(dt, calm) {
  springTo(dialState.rate, dialState.target.rate, dt, 0.28, calm);
  springTo(dialState.lo, dialState.target.lo, dt, 0.32, calm);
  springTo(dialState.hi, dialState.target.hi, dt, 0.32, calm);
  const a = angleOf(dialState.rate.x);
  const lo = angleOf(dialState.lo.x);
  const hi = angleOf(dialState.hi.x);
  dialEl.needle.setAttribute('transform', `rotate(${f2((a * 180) / Math.PI)})`);
  dialEl.lo.setAttribute('transform', `rotate(${f2((lo * 180) / Math.PI)})`);
  dialEl.hi.setAttribute('transform', `rotate(${f2((hi * 180) / Math.PI)})`);
  const r0 = R0 - 6.2;
  const r1 = R0 - 4.6;
  if (hi - lo > 0.01) {
    const o0 = polar(r1, lo);
    const o1 = polar(r1, hi);
    const i1 = polar(r0, hi);
    const i0 = polar(r0, lo);
    const big = hi - lo > Math.PI ? 1 : 0;
    dialEl.band.setAttribute('d', `M${f2(o0[0])} ${f2(o0[1])}A${r1} ${r1} 0 ${big} 1 ${f2(o1[0])} ${f2(o1[1])}L${f2(i1[0])} ${f2(i1[1])}A${r0} ${r0} 0 ${big} 0 ${f2(i0[0])} ${f2(i0[1])}Z`);
  } else dialEl.band.setAttribute('d', '');
}

let countersText = '';
function drawCounters() {
  const s = statsNow();
  const text = [`${String(s.c).padStart(2, '0')}/${String(s.n).padStart(2, '0')}`, s.passK === null ? '' : s.passK.toFixed(2), state.mode === 'P' ? `${String(s.recovered).padStart(2, '0')}/${String(s.injected).padStart(2, '0')}` : ''];
  const joined = text.join('|');
  if (joined === countersText) return;
  countersText = joined;
  el.counters.forEach((node, i) => {
    node.textContent = text[i];
  });
}

function readoutText() {
  if (selected) return PART_LINES[selected];
  const s = statsNow();
  const name = NAMES[state.mode];
  if (state.phase === 'generate') return state.generated ? `${name} · lever set, first block on the way` : `${name} · generating · coverage ${state.coverage} of ${D.coverage.flows * D.coverage.classes} cells · ${D.candidates.rejected} rejected`;
  if (state.phase === 'decide') return `${name} · ${s.n} runs · ${s.rate.toFixed(2)} [${s.lo.toFixed(2)},\u00a0${s.hi.toFixed(2)}] · gate ${s.gate === 'pass' ? 'lifts' : 'holds'}`;
  if (!s.n) return `${name} · first run on the line`;
  const rate = `pass ${s.c} of ${s.n}, ${s.rate.toFixed(2)} [${s.lo.toFixed(2)},\u00a0${s.hi.toFixed(2)}]`;
  if (state.mode === 'P') return `${name} · ${rate} · recovered ${s.recovered} of ${s.injected}`;
  return `${name} · ${rate} · pass^${D.model.k} ${s.passK === null ? 'n/a' : s.passK.toFixed(2)}`;
}
function say() {
  const text = readoutText();
  if (text !== said) {
    said = text;
    readout.textContent = text;
  }
}
function describe() {
  const s = statsNow();
  stage.setAttribute('aria-valuetext', `${NAMES[state.mode]}, ${s.n} of ${D.model.runs} runs`);
}
let announceTimer = 0;
function announce(text) {
  clearTimeout(announceTimer);
  announceTimer = setTimeout(() => {
    status.textContent = text;
  }, 700);
}

// ------------------------------------------------------------------ parts and input
const PART_LINES = Object.fromEntries(partButtons.map((b) => [b.dataset.piece, `${b.querySelector('.an-n').textContent} ${b.querySelector('.an-name').textContent.toLowerCase()}`]));
function select(piece) {
  selected = piece;
  if (piece) stage.dataset.focus = piece;
  else delete stage.dataset.focus;
  for (const node of svg.querySelectorAll('.an-line .it')) node.toggleAttribute('data-on', piece !== null && node.dataset.piece === piece);
  for (const b of partButtons) b.toggleAttribute('data-on', b.dataset.piece === piece);
}
for (const b of partButtons) {
  b.addEventListener('mouseenter', () => select(b.dataset.piece));
  b.addEventListener('focus', () => select(b.dataset.piece));
  b.addEventListener('mouseleave', () => select(null));
  b.addEventListener('blur', () => select(null));
}
svg.addEventListener('pointermove', (event) => {
  const item = event.target.closest('.an-line .it');
  const piece = item && item.dataset.piece !== 'line' ? item.dataset.piece : null;
  if (piece !== selected) select(piece);
});
svg.addEventListener('pointerleave', () => select(null));

function takeOver() {
  state.touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    state.touring = !still.matches;
    if (state.phase === 'decide') state.phaseAt = clock - DECIDE;
  }, 3600);
}
stage.addEventListener('keydown', (event) => {
  const modes = { 1: 'T', 2: 'F', 3: 'P' };
  if (modes[event.key]) {
    event.preventDefault();
    takeOver();
    if (state.mode !== modes[event.key] || state.phase === 'decide') {
      state.queue = [];
      startCampaign(modes[event.key]);
    }
    run();
    return;
  }
  if (event.key === ' ') {
    event.preventDefault();
    state.paused = !state.paused;
    takeOver();
    run();
    return;
  }
  const ids = partButtons.map((b) => b.dataset.piece);
  if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
    event.preventDefault();
    select(ids[(ids.indexOf(selected) + 1) % ids.length]);
    run();
  } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
    event.preventDefault();
    select(ids[(ids.indexOf(selected) - 1 + ids.length) % ids.length]);
    run();
  } else if (event.key === 'Escape') {
    select(null);
    run();
  }
});
stage.addEventListener('focus', () => {
  status.textContent = `${NAMES[state.mode]}, ${statsNow().n} of ${D.model.runs} runs`;
});

const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};
new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  },
  { rootMargin: '120px 0px' },
).observe(stage);

// A hook for captures: window.__anatomy.seek(mode, seconds) runs the machine forward without drawing each frame.
window.__anatomy = {
  seek(mode, seconds) {
    state.touring = false;
    state.queue = [];
    startCampaign(mode);
    const step = 1 / 60;
    for (let t = 0; t < seconds; t += step) {
      clock += step;
      advance(false);
      draw(step, false);
    }
    return readout.textContent;
  },
  pause(on = true) {
    state.paused = on;
  },
  step(seconds) {
    const step = 1 / 60;
    for (let t = 0; t < seconds; t += step) {
      clock += step;
      advance(false);
      draw(step, false);
    }
    return readout.textContent;
  },
  probe() {
    const at1 = state.slots[1];
    return { runs: state.runsDone.length, injecting: Boolean(at1 && at1.block.injected), tau: clock - state.stepAt - MOVE, phase: state.phase };
  },
};

startCampaign('T');
draw(0, still.matches);
// Captures at twice the size: hero.html?x2 doubles the page with CSS zoom, so the still renders crisp at 1x.
if (/[?&]x2\b/.test(location.search)) document.body.style.zoom = '2';
// A still for captures and links: index.html#at=P,39.62 runs the perturbed campaign to that second and holds it.
{
  const still = /^#at=([TFP]),(\d+(?:\.\d+)?)$/.exec(location.hash);
  if (still) {
    window.__anatomy.seek(still[1], Number(still[2]));
    state.paused = true;
  }
}
