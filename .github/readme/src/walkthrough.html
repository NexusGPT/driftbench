<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>driftbench: the walkthrough</title>
<link rel="stylesheet" href="brand.css">
<style>
  #frame { width: 640px; height: 240px; }
  .n { width: 134px; height: 132px; align-content: start; padding: 10px 11px; row-gap: 5px; }
  .nx-node__kind { font: 500 10px/1 var(--nx-mono); letter-spacing: .6px; text-transform: uppercase; white-space: nowrap; }
  .nx-node__title { font-size: 13px; }
  .nx-node__detail { font-size: 11px; line-height: 1.3; }
  .head-k { left: 16px; top: 16px; }
  .foot { position: absolute; left: 16px; top: 196px; width: 560px; font: 400 15px/1.2 var(--nx-serif); letter-spacing: var(--nx-serif-track); color: var(--nx-ink); }
</style></head><body>
<div id="frame" class="nx-ill scene"><div class="nx-ill__glass">
    <svg class="nx-edges" viewBox="0 0 620 220">
      <path class="nx-edge" d="M150 110 L166 110"/><path class="nx-edge" d="M300 110 L316 110"/><path class="nx-edge" d="M450 110 L466 110"/><path class="nx-edge" d="M161 104 L167 110 L161 116"/><path class="nx-edge" d="M311 104 L317 110 L311 116"/><path class="nx-edge" d="M461 104 L467 110 L461 116"/>
    </svg>
    <span class="nx-kind head-k">The walkthrough in four steps</span>
    <div class="nx-node n " style="left:16px;top:44px"><span class="nx-node__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></span><span class="nx-node__kind">1 Build</span><span class="nx-node__title">Files to tests</span><span class="nx-node__detail">116 atoms found, 1,424 tests written.</span></div>
    <div class="nx-node n " style="left:166px;top:44px"><span class="nx-node__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1"/><path d="M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/></svg></span><span class="nx-node__kind">2 Trace</span><span class="nx-node__title">A sentence to its tests</span><span class="nx-node__detail">Sentence, id, instruction, tests.</span></div>
    <div class="nx-node n " style="left:316px;top:44px"><span class="nx-node__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5l12 7-12 7z"/></svg></span><span class="nx-node__kind">3 Run</span><span class="nx-node__title">Run one test</span><span class="nx-node__detail">Each check says pass or fail.</span></div>
    <div class="nx-node n nx-ring" style="left:466px;top:44px"><span class="nx-node__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg></span><span class="nx-node__kind">4 Rerun</span><span class="nx-node__title">After an edit</span><span class="nx-node__detail">17 of 1251 blocks to rerun.</span></div>
    <div class="foot">One agent, one edit, four steps.</div>
</div></div>
<script>
  window.__fonts = ['400 17px "Libre Caslon Display"', '400 11px Geist', '600 13px Geist', '500 10px "Geist Mono"'];
  Promise.all(window.__fonts.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => { window.__ready = true; });
</script></body></html>
