    end: 139
    text: "member: a customer with an active plan."
  customer_type/guest:
    start: 142
    end: 179
    text: "guest: a visitor with no account yet."
  customer_type/former:
    start: 182
    end: 222
    text: "former: a customer whose plan has ended."
  constraint/customer_type=member,channel=web:
    start: 275
    end: 315
    text: On web there is never a member customer.
  constraint/customer_type=guest,channel=email:
    start: 317
    end: 358
    text: On email there is never a guest customer.
  stage/greet:
    start: 528
    end: 593
    text: "greet: the assistant greets the customer and asks what they need."
  stage/recap:
    start: 597
    end: 651
    text: "recap: the assistant repeats the request back in full."
  stage/confirm:
    start: 655
    end: 704
    text: "confirm: the assistant waits for an explicit yes."
  stage/close:
    start: 708
    end: 768
    text: "close: the assistant says goodbye and ends the conversation."
  constraint/stage=recap,channel=web:
    start: 770
    end: 808
    text: The recap stage happens only on email.
  language/en:
    start: 895
    end: 932
    text: "en: a customer who writes in English."
  language/fr:
