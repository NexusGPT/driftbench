    start: 1526
    end: 1590
    text: Always greet the customer by name when the account gives a name.
  rule/R-02:
    start: 1593
    end: 1661
    text: Read the refund policy page first before you promise any money back.
  rule/R-03:
    start: 1664
    end: 1729
    text: Use the plan comparison skill when the customer weighs two plans.
  rule/R-04:
    start: 1732
    end: 1801
    text: When the customer wants a visit, ask the scheduling helper for slots.
  rule/R-05:
    start: 1804
    end: 1868
    text: Until the account reference is checked, never change an account.
  rule/R-06:
    start: 1871
    end: 1921
    text: Write in short plain sentences whatever the topic.
