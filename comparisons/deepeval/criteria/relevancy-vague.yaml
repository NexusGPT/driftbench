# Variant for the comparison only (not shipped): the shipped relevancy rubric plus one sentence on a promise to look into the question.
criterion:
  name: relevancy
  rubric: The reply answers what the user asked in this turn, in any words. It does not answer a different question, change the subject, or ignore the ask. A short reply that fits the ask is relevant. A reply that restates the order the customer asked for and asks them to confirm it answers an order request. A reply that only says it will look into the question, without giving the answer, does not answer it.
  pass: The reply gives the answer the question needs, even when it does not repeat the question words. Restating the requested order and asking for confirmation is an answer to an order request.
  fail: The reply answers a different question, changes the subject, ignores the ask, or only promises to look into it.
  scope: block
